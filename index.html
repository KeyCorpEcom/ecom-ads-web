let pagesFilter = { status: 'all', product: 'all', country: 'all' };

// Normalise une URL : ajoute https:// si absent
function normalizeUrl(url) {
  if (!url) return null;
  url = url.trim();
  if (!url) return null;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  return url;
}

/* ============================================================
   PAGES LANDING — Workflow manuel (copie concurrent → Shopify)
   ============================================================ */

const PRIORITY_META = {
  urgent: { label: 'URGENT',   emoji: '🔴', color: '#f87171', weight: 4 },
  high:   { label: 'HAUTE',    emoji: '🟠', color: '#fb923c', weight: 3 },
  normal: { label: 'NORMALE',  emoji: '🔵', color: '#60a5fa', weight: 2 },
  low:    { label: 'BASSE',    emoji: '⚪', color: '#94a3b8', weight: 1 }
};

const STATUS_META = {
  pending:  { label: 'À faire',   emoji: '⏸', color: 'var(--text-dim)' },
  built:    { label: 'En review', emoji: '⏳', color: 'var(--orange)' },
  approved: { label: 'Validée',   emoji: '✅', color: 'var(--green)' },
  rejected: { label: 'Rejetée',   emoji: '❌', color: 'var(--red)' }
};

function priorityBadge(priority) {
  const p = PRIORITY_META[priority] || PRIORITY_META.normal;
  return `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:0.5px;background:${p.color}22;color:${p.color};border:1px solid ${p.color}44">${p.emoji} ${p.label}</span>`;
}

function pageStatusBadge(status) {
  const s = STATUS_META[status] || STATUS_META.pending;
  return `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600;background:rgba(138,138,154,0.1);color:${s.color}">${s.emoji} ${s.label}</span>`;
}

async function renderPagesHome(el) {
  const [{ data: products }, { data: countriesAll }, { data: pages }] = await Promise.all([
    sb.from('products').select('*').order('created_at', { ascending: false }),
    sb.from('countries').select('*').order('sort_order'),
    sb.from('product_pages').select('*')
  ]);

  const pagesByKey = {};
  (pages || []).forEach(p => { pagesByKey[`${p.product_id}|${p.country_id}`] = p; });

  // Aggrège par produit : stats + progress
  const productRows = (products || []).map(product => {
    const enabled = (product.enabled_countries?.length ? product.enabled_countries : countriesAll.map(c => c.id));
    const cuts = product.cut_countries || [];
    const active = enabled.filter(cId => !cuts.includes(cId));
    const stats = { pending: 0, built: 0, approved: 0, rejected: 0 };
    active.forEach(cId => {
      const pg = pagesByKey[`${product.id}|${cId}`];
      const status = pg?.status || 'pending';
      stats[status] = (stats[status] || 0) + 1;
    });
    const total = active.length;
    const progressPct = pct(stats.approved, total);
    const allDone = total > 0 && stats.approved === total;
    return { product, stats, total, progressPct, allDone, priority: product.priority || 'normal' };
  });

  // Stats globales
  const globalStats = { pending: 0, built: 0, approved: 0, rejected: 0 };
  productRows.forEach(r => {
    Object.keys(globalStats).forEach(k => { globalStats[k] += r.stats[k] || 0; });
  });

  // Tri : priorité DESC puis date DESC
  productRows.sort((a, b) => {
    const pa = PRIORITY_META[a.priority]?.weight || 2;
    const pb = PRIORITY_META[b.priority]?.weight || 2;
    if (pa !== pb) return pb - pa;
    const da = new Date(a.product.created_at || 0).getTime();
    const db = new Date(b.product.created_at || 0).getTime();
    return db - da;
  });

  // Filtre : par défaut on masque les produits 100% validés
  const hideValidated = localStorage.getItem('pages_hide_validated') !== 'false';
  const visibleRows = hideValidated ? productRows.filter(r => !r.allDone) : productRows;

  el.innerHTML = `
    <div class="page-head">
      <div>
        <div class="page-title">🌍 Product Page</div>
        <div class="page-subtitle">${globalStats.pending} à faire · ${globalStats.built} en review · ${globalStats.approved} validées · ${globalStats.rejected} rejetées</div>
      </div>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:12px">
        <input type="checkbox" id="toggle-hide-validated" ${hideValidated ? 'checked' : ''} style="accent-color:var(--gold)">
        <span>Masquer les produits 100% validés</span>
      </label>
    </div>

    ${visibleRows.length === 0 ? `
      <div class="empty" style="padding:60px 20px">
        <div class="empty-icon" style="font-size:48px">${productRows.length === 0 ? '🌍' : '🎉'}</div>
        <div class="empty-title">${productRows.length === 0 ? 'Aucun produit' : 'Tout est validé !'}</div>
        <div class="empty-text">${productRows.length === 0 ? 'Crée un produit pour voir ses pages landing ici.' : 'Décoche le filtre pour voir les produits déjà finis.'}</div>
      </div>
    ` : `
      <div style="display:flex;flex-direction:column;gap:10px">
        ${visibleRows.map(r => {
          const p = r.product;
          const priorityBar = PRIORITY_META[r.priority]?.color || '#60a5fa';
          const concurrentUrl = p.concurrent_page_url ? normalizeUrl(p.concurrent_page_url) : null;
          // Mini-badges par statut (seulement si count > 0)
          const statusBadges = [
            r.stats.pending  > 0 ? `<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:8px;font-size:11px;background:rgba(138,138,154,0.12);color:var(--text-dim);font-weight:600">⏸ ${r.stats.pending}</span>` : '',
            r.stats.built    > 0 ? `<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:8px;font-size:11px;background:rgba(251,146,60,0.15);color:var(--orange);font-weight:600">⏳ ${r.stats.built}</span>` : '',
            r.stats.approved > 0 ? `<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:8px;font-size:11px;background:rgba(52,211,153,0.15);color:var(--green);font-weight:600">✅ ${r.stats.approved}</span>` : '',
            r.stats.rejected > 0 ? `<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:8px;font-size:11px;background:rgba(248,113,113,0.15);color:var(--red);font-weight:600">❌ ${r.stats.rejected}</span>` : ''
          ].filter(Boolean).join(' ');

          return `
            <div style="background:var(--bg-card);border:1px solid var(--border);border-left:4px solid ${priorityBar};border-radius:10px;padding:14px 16px;cursor:pointer;transition:all 0.15s" data-open-product="${escapeHtml(p.id)}" onmouseover="this.style.background='var(--bg-input)'" onmouseout="this.style.background='var(--bg-card)'">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px">
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                  ${r.priority !== 'normal' ? priorityBadge(r.priority) : ''}
                  <span class="mono" style="color:var(--gold);font-weight:700;font-size:15px">${escapeHtml(p.id)}</span>
                  <span style="color:var(--text-dim)">·</span>
                  <span style="color:var(--text);font-weight:500">${escapeHtml(p.name || '')}</span>
                </div>
                <span class="mono" style="color:var(--gold);font-weight:700;font-size:13px">${r.stats.approved}/${r.total} · ${r.progressPct}%</span>
              </div>

              <div style="height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:10px">
                <div style="width:${r.progressPct}%;height:100%;background:linear-gradient(90deg,var(--gold),var(--green));transition:width 0.4s"></div>
              </div>

              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${statusBadges}</div>
                <div style="display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-dim)">
                  ${concurrentUrl ? `<a href="${escapeHtml(concurrentUrl)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" style="color:var(--blue);text-decoration:underline">🔗 Concurrent ↗</a>` : '<span style="color:var(--red)">⚠️ Pas d\'URL concurrent</span>'}
                  <span>${r.total} pays</span>
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `}
  `;

  // Handlers
  document.getElementById('toggle-hide-validated')?.addEventListener('change', (e) => {
    localStorage.setItem('pages_hide_validated', e.target.checked ? 'true' : 'false');
    render();
  });

  el.querySelectorAll('[data-open-product]').forEach(card => {
    card.addEventListener('click', () => navigate('pages/' + card.dataset.openProduct));
  });
}

      const url = normalizeUrl(input.value);
      await upsertPagePartial(productId, cId, { built_url: url });
      toast('URL enregistrée', 'success');
      render();
    });
  });

  el.querySelectorAll('[data-mark-built]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const cId = btn.dataset.markBuilt;
      const input = el.querySelector(`[data-country-url="${cId}"]`);
      const url = input ? normalizeUrl(input.value) : null;

      const cId = btn.dataset.validate;
      await upsertPagePartial(productId, cId, {
        status: 'approved',
        approved_by: currentUser.id,
        approved_at: new Date().toISOString(),
        notes: null

      toast('✅ Page validée', 'success');
      render();
    });
  });

  el.querySelectorAll('[data-reject]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!isAdmin()) { toast('Seul un admin peut rejeter', 'error'); return; }
      const cId = btn.dataset.reject;
      const country = countriesAll.find(c => c.id === cId);
      const r = await modal(`
        <div class="modal-title" style="color:var(--red)">❌ Rejeter ${escapeHtml(product.id)} / ${cId}</div>

        <div class="modal-actions">
          <button class="btn btn-secondary" data-modal-close>Annuler</button>
          <button class="btn btn-danger" data-modal-ok>Rejeter avec feedback</button>
        </div>
      `);
      if (!r) return;
      const feedback = (r.feedback || '').trim();
      if (!feedback) { toast('Le feedback est obligatoire pour rejeter', 'error'); return; }
      await upsertPagePartial(productId, cId, {
        status: 'rejected',
        notes: feedback,
        approved_by: null,
        approved_at: null
      });
      toast('❌ Page rejetée avec feedback', 'success');
      render();
    });
  });

  el.querySelectorAll('[data-unvalidate]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!isAdmin()) { toast('Seul un admin peut retirer une validation', 'error'); return; }
      const cId = btn.dataset.unvalidate;
      if (!await confirmDialog('Retirer la validation', `La page ${cId} repassera à "En review".`)) return;
      await upsertPagePartial(productId, cId, {
        status: 'built',
        approved_by: null,
        approved_at: null
      });
      toast('Validation retirée', 'success');
      render();
    });
  });
}

// Helper : upsert partiel dans product_pages (pour les modifs à la volée)
async function upsertPagePartial(productId, countryId, patch) {
  const { data: existing } = await sb.from('product_pages')
    .select('product_id')
    .eq('product_id', productId).eq('country_id', countryId).maybeSingle();
  const payload = { ...patch, updated_at: new Date().toISOString(), updated_by: currentUser.id };
  if (existing) {
    await sb.from('product_pages').update(payload).eq('product_id', productId).eq('country_id', countryId);
  } else {
    await sb.from('product_pages').insert({ product_id: productId, country_id: countryId, ...payload });
  }
}

let driveState = { gapiReady: false, tokenClient: null, accessToken: null, connected: false };
let autoSyncTimer = null;
let isSyncing = false;

function saveTokenToStorage(token, expiresIn) {
  const expiresAt = Date.now() + ((expiresIn || 3600) * 1000);
  try {
    localStorage.setItem('keycorp_drive_token', token);
    localStorage.setItem('keycorp_drive_token_exp', String(expiresAt));
  } catch (e) {}
}
function getStoredToken() {
  try {
    const token = localStorage.getItem('keycorp_drive_token');
    const exp = parseInt(localStorage.getItem('keycorp_drive_token_exp'), 10);
    if (!token || !exp || exp < Date.now() + 60000) { clearStoredToken(); return null; }
    return token;
  } catch (e) { return null; }
}
function clearStoredToken() {
  try {
    localStorage.removeItem('keycorp_drive_token');
    localStorage.removeItem('keycorp_drive_token_exp');
  } catch (e) {}
}

function waitForGoogleLibs() {
  return new Promise(resolve => {
    const check = () => {
      if (window.gapi && window.google?.accounts?.oauth2) resolve();
      else setTimeout(check, 100);
    };
    check();
  });
}

async function initGapiClient(apiKey) {
  await waitForGoogleLibs();
  if (driveState.gapiReady) return;
  await new Promise((resolve, reject) => {
    gapi.load('client', {
      callback: async () => {
        try {
          await gapi.client.init({
            apiKey: apiKey,
            discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']
          });
          driveState.gapiReady = true;
          resolve();
        } catch (e) { reject(e); }
      },
      onerror: reject
    });
  });
}

async function driveConnect(options = {}) {
  const silent = options.silent === true;
  let cfg = null;
  try {
    const { data } = await sb.from('drive_config').select('*').eq('id', 1).maybeSingle();
    cfg = data;
  } catch (e) {
    console.error('[DRIVE] Erreur lecture config', e);
    if (!silent) toast('Erreur lecture config : ' + (e.message || JSON.stringify(e)), 'error');
    return;
  }
  if (!cfg?.client_id || !cfg?.api_key) {
    if (!silent) toast('Renseigne Client ID et API Key d\'abord', 'error');
    return;
  }
  try {
    // Wait for Google libs to be loaded
    await waitForGoogleLibs();
    if (!window.google?.accounts?.oauth2) {
      if (!silent) toast('Google Identity Services non chargé — recharge la page', 'error');
      return;
    }
    await initGapiClient(cfg.api_key);
    if (!driveState.tokenClient) {
      driveState.tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: cfg.client_id,
        scope: 'https://www.googleapis.com/auth/drive',
        callback: async (resp) => {
          if (resp.error) {
            console.error('[DRIVE] OAuth callback error', resp);
            if (!silent) toast('Erreur OAuth : ' + (resp.error_description || resp.error), 'error');
            return;
          }
          driveState.accessToken = resp.access_token;
          driveState.connected = true;
          gapi.client.setToken({ access_token: resp.access_token });
          saveTokenToStorage(resp.access_token, resp.expires_in);
          if (!silent) {
            await logSync('Connecté à Google Drive', 'success');
            toast('✅ Connecté à Drive', 'success');
          } else {
            await logSync('Reconnexion auto à Drive', 'info');
          }
          render();
          setupAutoSync();
        },
        error_callback: (err) => {
          console.error('[DRIVE] error_callback', err);
          if (!silent) {
            const msg = err?.message || err?.type || JSON.stringify(err || {});
            toast('OAuth erreur : ' + msg, 'error');
          }
        }
      });
    }
    driveState.tokenClient.requestAccessToken({ prompt: silent ? '' : (driveState.accessToken ? '' : 'consent') });
  } catch (e) {
    console.error('[DRIVE] Connect error', e);
    if (!silent) {
      const msg = e?.message || e?.result?.error?.message || e?.error?.message || JSON.stringify(e || {});
      toast('Erreur connexion Drive : ' + msg, 'error', 6000);
    }
  }
}

async function tryAutoReconnectDrive() {
  const { data: cfg } = await sb.from('drive_config').select('*').eq('id', 1).maybeSingle();
  if (!cfg?.client_id || !cfg?.api_key) return;
  const storedToken = getStoredToken();
  if (storedToken) {
    try {
      await initGapiClient(cfg.api_key);
      driveState.accessToken = storedToken;
      driveState.connected = true;
      gapi.client.setToken({ access_token: storedToken });
      await logSync('Reconnecté via token stocké', 'info');
      setupAutoSync();
      return;
    } catch (e) { clearStoredToken(); }
  }
  setTimeout(() => driveConnect({ silent: true }), 1500);
}

function driveDisconnect() {
  if (driveState.accessToken) { google.accounts.oauth2.revoke(driveState.accessToken, () => {}); }
  clearStoredToken();
  driveState.accessToken = null;
  driveState.connected = false;
  if (window.gapi?.client) gapi.client.setToken(null);
  clearInterval(autoSyncTimer);
  logSync('Déconnecté de Drive', 'info');
  toast('Déconnecté', 'info');
  render();
}

async function logSync(msg, type = 'info') {
  await sb.from('sync_log').insert({ msg, type, user_id: currentUser?.id || null });
}

/* ===== Drive Helpers : Create/Find/Upload Folders & Files ===== */
const CONCURRENT_FOLDER_NAME = '00_Ads_Concurrent';
const MASTER_FOLDER_NAME = '00_Master_Ads';

function driveProductFolderName(p) {
  if (!p.name || p.name === p.id) return p.id;
  return `${p.id} — ${p.name}`;
}

async function driveCreateFolder(name, parentId) {
  const r = await gapi.client.drive.files.create({
    resource: { name, mimeType: 'application/vnd.google-apps.folder', parents: parentId ? [parentId] : undefined },
    fields: 'id, name'
  });
  return r.result;
}

async function driveFindFolder(name, parentId) {
  const safeName = name.replace(/'/g, "\\'");
  const r = await gapi.client.drive.files.list({
    q: `'${parentId}' in parents and mimeType = 'application/vnd.google-apps.folder' and name = '${safeName}' and trashed = false`,
    fields: 'files(id, name)',
    pageSize: 1
  });
  return (r.result.files || [])[0] || null;
}

async function driveEnsureFolder(name, parentId) {
  const existing = await driveFindFolder(name, parentId);
  if (existing) return existing;
  return await driveCreateFolder(name, parentId);
}

async function driveRenameFile(fileId, newName) {
  return await gapi.client.drive.files.update({ fileId, resource: { name: newName } });
}

async function driveTrashFolder(folderId) {
  // Met le dossier à la corbeille Drive (récupérable 30 jours)
  return await gapi.client.drive.files.update({
    fileId: folderId,
    resource: { trashed: true }
  });
}

// ============================================================
// Drive Google Docs — création/mise à jour pour ad copy
// ============================================================
async function driveFindFile(name, parentId, mimeType) {
  const safeName = name.replace(/'/g, "\\'");
  const mimeQuery = mimeType ? ` and mimeType = '${mimeType}'` : '';
  const r = await gapi.client.drive.files.list({
    q: `'${parentId}' in parents and name = '${safeName}'${mimeQuery} and trashed = false`,
    fields: 'files(id, name, mimeType)',
    pageSize: 1
  });
  return (r.result.files || [])[0] || null;
}

async function driveCreateGoogleDocFromHtml(name, parentId, htmlContent) {
  const accessToken = driveState.accessToken;
  if (!accessToken) throw new Error('Pas connecté à Drive');
  const metadata = {
    name,
    mimeType: 'application/vnd.google-apps.document',
    parents: parentId ? [parentId] : undefined
  };
  const boundary = '-------keycorp-' + Math.random().toString(36).slice(2);
  const body =
    `--${boundary}\r\n` +
    `Content-Type: application/json; charset=UTF-8\r\n\r\n` +
    JSON.stringify(metadata) + `\r\n` +
    `--${boundary}\r\n` +
    `Content-Type: text/html; charset=UTF-8\r\n\r\n` +
    htmlContent + `\r\n` +
    `--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${accessToken}`,
      'Content-Type': `multipart/related; boundary=${boundary}`
    },
    body
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Drive create doc: HTTP ${res.status} — ${errText}`);
  }
  return await res.json();
}

async function driveUpdateGoogleDocFromHtml(fileId, htmlContent) {
  const accessToken = driveState.accessToken;
  if (!accessToken) throw new Error('Pas connecté à Drive');
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: {
      'Authorization': `Bearer ${accessToken}`,
      'Content-Type': 'text/html; charset=UTF-8'
    },
    body: htmlContent
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Drive update doc: HTTP ${res.status} — ${errText}`);
  }
  return await res.json();
}

function formatAdCopyAsHtml(adName, copy) {
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nlToBr = (s) => esc(s).replace(/\n/g, '<br>');
  const sections = [];

  sections.push(`<h1 style="font-family:Arial,sans-serif;color:#c8a55a">📝 ${esc(adName)} — Ad Copy</h1>`);
  if (copy.url)         sections.push(`<p><strong>🔗 Source URL :</strong> <a href="${esc(copy.url)}">${esc(copy.url)}</a></p>`);
  if (copy.headline)    sections.push(`<h2>📌 Headline</h2><p>${esc(copy.headline)}</p>`);
  if (copy.primary)     sections.push(`<h2>📝 Primary text</h2><p>${nlToBr(copy.primary)}</p>`);
  if (copy.description) sections.push(`<h2>📄 Description</h2><p>${esc(copy.description)}</p>`);
  if (copy.cta)         sections.push(`<h2>🎯 CTA</h2><p>${esc(copy.cta)}</p>`);

  const hasStats = copy.spend || copy.views || copy.runningSince || copy.score || copy.activeCountries;
  if (hasStats) {
    sections.push(`<h2>📊 Stats</h2><ul>`);
    if (copy.spend)           sections.push(`<li><strong>💰 Ad spend :</strong> ${esc(copy.spend)}</li>`);
    if (copy.views)           sections.push(`<li><strong>👁️ Vues :</strong> ${esc(copy.views)}</li>`);
    if (copy.runningSince)    sections.push(`<li><strong>📅 Running depuis :</strong> ${esc(copy.runningSince)}</li>`);
    if (copy.score)           sections.push(`<li><strong>⭐ Score :</strong> ${esc(copy.score)}/10</li>`);
    if (copy.activeCountries) sections.push(`<li><strong>🌍 Pays actifs :</strong> ${esc(copy.activeCountries)}</li>`);
    sections.push(`</ul>`);
  }

  if (copy.notes) sections.push(`<h2>💬 Notes perso</h2><p>${nlToBr(copy.notes)}</p>`);
  sections.push(`<hr><p style="font-size:11px;color:#888">Dernière mise à jour : ${new Date().toLocaleString('fr-FR')} · Synchronisé depuis keycorp-ecom.com</p>`);

  return `<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body style="font-family:Arial,sans-serif;line-height:1.6">${sections.join('\n')}</body></html>`;
}

// Sync ad copy → Google Doc dans 00_Ads_Concurrent
async function syncAdCopyToDrive(adId) {
  if (!driveState.connected) return { skipped: true, reason: 'not_connected' };
  try {
    const { data: ad } = await sb.from('ads').select('*, products(drive_folder_id)').eq('id', adId).single();
    if (!ad) return { skipped: true, reason: 'ad_not_found' };
    const driveFolderId = ad.products?.drive_folder_id;
    if (!driveFolderId) return { skipped: true, reason: 'no_drive_folder' };

    const concurrentFolder = await driveFindFolder(CONCURRENT_FOLDER_NAME, driveFolderId);
    if (!concurrentFolder) return { skipped: true, reason: 'concurrent_folder_missing' };

    const adNumber = ad.position || (parseInt((ad.name.match(/\d+/) || [0])[0], 10)) || 1;
    const docName = `Ad copy ${adNumber}`;
    const html = formatAdCopyAsHtml(ad.name, ad.ad_copy || {});

    const existing = await driveFindFile(docName, concurrentFolder.id, 'application/vnd.google-apps.document');
    if (existing) {
      await driveUpdateGoogleDocFromHtml(existing.id, html);
      return { ok: true, action: 'updated', docId: existing.id, docName };
    } else {
      const created = await driveCreateGoogleDocFromHtml(docName, concurrentFolder.id, html);
      return { ok: true, action: 'created', docId: created.id, docName };
    }
  } catch (e) {
    console.error('[AD COPY → DRIVE]', e);
    return { ok: false, error: e.message };
  }
}

// Synchronise TOUS les dossiers pays d'un produit (utilisé par le bouton "🎨 Sync couleurs")
async function syncProductFolderColors(product, countries) {
  if (!driveState.connected || !driveState.accessToken) {
    toast('Connecte-toi à Drive d\'abord', 'warn');
    return;
  }
  if (!product?.drive_folder_id) {
    toast('Pas de dossier Drive pour ce produit', 'warn');
    return;
  }
  const cuts = product.cut_countries || [];
  const enabled = (product.enabled_countries?.length ? product.enabled_countries : countries.map(c => c.id));

  toast('🎨 Synchronisation des couleurs...', 'info');
  let updated = 0, errors = 0, missing = 0;
  for (const cId of enabled) {
    try {
      const folder = await driveFindFolder(cId, product.drive_folder_id);
      if (!folder) { missing++; continue; }
      const color = cuts.includes(cId) ? DRIVE_COLOR_CUT : DRIVE_COLOR_ACTIVE;
      await driveSetFolderColor(folder.id, color);
      updated++;
    } catch (e) {
      console.error(`[SYNC COLORS] ${cId}`, e);
      errors++;
    }
  }
  const parts = [`${updated} colorisé(s)`];
  if (missing > 0) parts.push(`${missing} dossier(s) introuvables`);
  if (errors > 0) parts.push(`${errors} erreur(s)`);
  toast(`🎨 ${parts.join(', ')}`, errors > 0 ? 'warn' : 'success', 5000);
}

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}

function detectFileExtension(name) {
  const m = name.match(/\.([a-z0-9]+)$/i);
  return m ? '.' + m[1].toLowerCase() : '';
}

// Upload d'un fichier vers Drive avec progression (XHR multipart)
function driveUploadWithProgress(file, parentId, name, onProgress) {
  return new Promise((resolve, reject) => {
    const token = gapi.client.getToken()?.access_token;
    if (!token) { reject(new Error('Pas de token Drive')); return; }
    const metadata = { name, parents: [parentId] };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', file);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size');
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress({ loaded: e.loaded, total: e.total, ratio: e.loaded / e.total });
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); } catch (e) { reject(e); }
      } else {
        let msg = 'HTTP ' + xhr.status;
        try { const j = JSON.parse(xhr.responseText); if (j.error?.message) msg = j.error.message; } catch {}
        reject(new Error(msg));
      }
    };
    xhr.onerror = () => reject(new Error('Erreur réseau pendant upload'));
    xhr.send(form);
  });
}

// Crée toute la structure Drive pour un produit
async function createProductDriveStructure(product, countries) {
  if (!driveState.connected || !driveState.accessToken) throw new Error('Pas connecté à Drive');
  const { data: cfg } = await sb.from('drive_config').select('*').eq('id', 1).single();
  const rootId = cfg?.root_folder_id;
  if (!rootId) throw new Error('Dossier racine Drive non configuré');

  const folderName = driveProductFolderName(product);
  let productFolder = await driveFindFolder(folderName, rootId);
  if (!productFolder) productFolder = await driveFindFolder(product.id, rootId);
  if (!productFolder) {
    productFolder = await driveCreateFolder(folderName, rootId);
  } else if (productFolder.name !== folderName) {
    await driveRenameFile(productFolder.id, folderName);
  }
  await driveEnsureFolder(CONCURRENT_FOLDER_NAME, productFolder.id);
  await driveEnsureFolder(MASTER_FOLDER_NAME, productFolder.id);
  for (const c of countries) {
    await driveEnsureFolder(c.id, productFolder.id);
  }
  // Update product with folder id
  await sb.from('products').update({ drive_folder_id: productFolder.id }).eq('id', product.id);
  await logSync(`✅ Structure Drive créée : ${folderName}`, 'success');
  return productFolder.id;
}

// Modal avec barres de progression pour l'upload
async function uploadFilesWithProgressUI(files, parentId, options = {}) {
  const title = options.title || `Upload ${files.length} fichier${files.length > 1 ? 's' : ''}`;
  const container = document.getElementById('modal-container');
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.innerHTML = `
    <div class="modal" style="min-width:500px;max-width:700px">
      <div class="modal-title">${escapeHtml(title)}</div>
      <div id="upload-list" style="max-height:60vh;overflow-y:auto"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="upload-close" style="display:none">Fermer</button>
      </div>
    </div>
  `;
  container.appendChild(bd);
  const list = bd.querySelector('#upload-list');
  list.innerHTML = files.map((item, i) => `
    <div style="padding:10px;margin-bottom:6px;background:var(--bg-input);border-radius:8px" data-up-idx="${i}">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px">
        <strong>${escapeHtml(item.displayName)}</strong>
        <span class="text-dim" data-up-status="${i}">En attente...</span>
      </div>
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px">${escapeHtml(item.file.name)} · ${fmtBytes(item.file.size)}</div>
      <div style="height:6px;background:var(--bg);border-radius:3px;overflow:hidden">
        <div data-up-bar="${i}" style="height:100%;width:0%;background:var(--gold);transition:width 0.2s"></div>
      </div>
    </div>
  `).join('');

  const results = [];
  for (let i = 0; i < files.length; i++) {
    const item = files[i];
    const statusEl = bd.querySelector(`[data-up-status="${i}"]`);
    const barEl = bd.querySelector(`[data-up-bar="${i}"]`);
    statusEl.textContent = 'Upload...';
    try {
      const r = await driveUploadWithProgress(item.file, parentId, item.displayName, (p) => {
        barEl.style.width = Math.round(p.ratio * 100) + '%';
      });
      barEl.style.width = '100%';
      barEl.style.background = 'var(--green)';
      statusEl.textContent = '✅ OK';
      statusEl.style.color = 'var(--green)';
      results.push({ ok: true, file: r, item });
    } catch (e) {
      barEl.style.background = 'var(--red)';
      statusEl.textContent = '❌ ' + (e.message || 'Erreur');
      statusEl.style.color = 'var(--red)';
      results.push({ ok: false, error: e.message, item });
    }
  }
  const closeBtn = bd.querySelector('#upload-close');
  closeBtn.style.display = '';
  closeBtn.addEventListener('click', () => bd.remove());
  bd.addEventListener('click', (e) => { if (e.target === bd) bd.remove(); });
  return results;
}

async function uploadToProductFolder(productId, files, targetFolderName) {
  console.log('[UPLOAD] Start', { productId, targetFolderName, fileCount: files.length });
  const filesArr = Array.from(files);
  console.log('[UPLOAD] Files:', filesArr.map(f => f.name));
  const { data: product } = await sb.from('products').select('*').eq('id', productId).single();
  if (!product) { toast('Produit introuvable', 'error'); return []; }
  console.log('[UPLOAD] Product:', product.id, 'drive_folder_id:', product.drive_folder_id);
  const { data: countriesAll } = await sb.from('countries').select('*').order('sort_order');
  const enabled = (product.enabled_countries?.length ? product.enabled_countries : countriesAll.map(c => c.id));
  const countries = countriesAll.filter(c => enabled.includes(c.id));

  // Assure que la structure Drive existe
  let productFolderId = product.drive_folder_id;
  if (!productFolderId) {
    productFolderId = await createProductDriveStructure(product, countries);
  }
  const targetFolder = await driveEnsureFolder(targetFolderName, productFolderId);

  // Liste des ads existantes + numéros utilisés (dans DB + Drive target folder)
  const { data: existingAdsDb } = await sb.from('ads').select('id, name').eq('product_id', product.id);
  const existingNumsDb = new Set((existingAdsDb || []).map(a => { const m = a.name.match(/Ad\s*(\d+)/i); return m ? parseInt(m[1], 10) : 0; }).filter(n => n > 0));

  const existingFiles = await driveListFolderContent(targetFolder.id);
  const existingNumsDrive = new Set(existingFiles.map(f => { const m = f.name.match(/Ad\s*(\d+)/i); return m ? parseInt(m[1], 10) : 0; }).filter(n => n > 0));

  // Mode : CONCURRENT = auto-number | MASTER + COUNTRY = strict (Ad X requis, pas de doublon)
  const strictMode = targetFolderName !== CONCURRENT_FOLDER_NAME;
  console.log('[UPLOAD] Mode:', strictMode ? 'STRICT' : 'AUTO', 'existingNumsDb:', [...existingNumsDb], 'existingNumsDrive:', [...existingNumsDrive]);
  let maxN = Math.max(0, ...existingNumsDb, ...existingNumsDrive);
  const items = [];
  const errors = [];

  for (const f of filesArr) {
    const m = f.name.match(/Ad\s*(\d+)/i);
    let adNum;

    if (strictMode) {
      // STRICT : Ad X obligatoire dans le nom, pas de doublon autorisé
      if (!m) {
        errors.push({ file: f.name, reason: 'Nom invalide — il doit contenir "Ad X" (ex: Ad 3.mp4, Ad 3 clean.mov)' });
        continue;
      }
      adNum = parseInt(m[1], 10);
      if (existingNumsDrive.has(adNum)) {
        errors.push({ file: f.name, reason: `Ad ${adNum} existe déjà dans ce dossier. Supprime d'abord l'ancienne sur Drive.` });
        continue;
      }
    } else {
      // AUTO (concurrent) : garde le n° si détecté ET libre, sinon auto-incrément
      if (m && !existingNumsDrive.has(parseInt(m[1], 10))) {
        adNum = parseInt(m[1], 10);
      } else {
        maxN++;
        adNum = maxN;
      }
    }
    // Réserve ce numéro pour éviter collision intra-batch
    existingNumsDrive.add(adNum);
    items.push({ file: f, displayName: `Ad ${adNum}${detectFileExtension(f.name)}`, adNum });
  }

  console.log('[UPLOAD] items:', items.length, 'errors:', errors.length, 'items detail:', items.map(i => i.displayName));

  // Si aucun item à uploader ET pas d'erreur → c'est qu'on a reçu 0 fichier
  if (items.length === 0 && errors.length === 0) {
    toast('Aucun fichier à uploader', 'warn');
    return [];
  }

  // Bloquer si erreurs
  if (errors.length > 0) {
    const errorsHtml = errors.map(e => `<div style="padding:10px;background:rgba(248,113,113,0.1);border-left:3px solid var(--red);border-radius:6px;margin-bottom:8px;font-size:12px"><strong style="color:var(--red)">❌ ${escapeHtml(e.file)}</strong><br><span class="text-dim">${escapeHtml(e.reason)}</span></div>`).join('');
    await modal(`
      <div class="modal-title" style="color:var(--red)">⚠️ ${errors.length} fichier(s) refusé(s)</div>
      <div class="text-sm text-dim mb-md">Les fichiers suivants ne peuvent pas être uploadés :</div>
      ${errorsHtml}
      <div class="text-sm" style="margin-top:14px;padding:10px;background:var(--bg-input);border-radius:6px;border-left:3px solid var(--blue);line-height:1.6">
        💡 <strong>Règles de nommage pour ${escapeHtml(targetFolderName)} :</strong><br>
        • Le nom doit contenir <span class="mono">Ad X</span> (ex: <span class="mono">Ad 3.mp4</span>, <span class="mono">Ad 3 clean.mov</span>)<br>
        • Le numéro doit correspondre à une ad concurrent existante<br>
        • Si Ad X existe déjà, supprime d'abord l'ancienne version sur Drive
      </div>
      <div class="modal-actions">
        <button class="btn" data-modal-close>Compris</button>
      </div>
    `);
    if (items.length === 0) return [];
  }

  const results = await uploadFilesWithProgressUI(items, targetFolder.id, {
    title: `Upload ${items.length} fichier(s) → ${product.id}/${targetFolderName}`
  });
  const okResults = results.filter(r => r.ok);
  const koResults = results.filter(r => !r.ok);
  const okCount = okResults.length;

  console.log('[UPLOAD] Results:', { ok: okCount, ko: koResults.length });
  if (koResults.length > 0) {
    console.error('[UPLOAD] Failed uploads:', koResults.map(r => ({ file: r.item.file.name, error: r.error })));
  }

  // Si upload dans 00_Ads_Concurrent → créer les ads directement (plus besoin d'attendre Master)
  if (targetFolderName === CONCURRENT_FOLDER_NAME && okCount > 0) {
    const existingAdsByName = {};
    (existingAdsDb || []).forEach(a => { existingAdsByName[a.name.toLowerCase()] = a; });
    const adsToInsert = [];
    const adsToUpdate = [];
    for (const r of okResults) {
      const adNum = r.item.adNum;
      const adName = `Ad ${adNum}`;
      const existing = existingAdsByName[adName.toLowerCase()];
      if (existing) {
        adsToUpdate.push({ id: existing.id, concurrent_file_id: r.file?.id || null });
      } else {
        adsToInsert.push({
          product_id: product.id,
          name: adName,
          position: adNum,
          concurrent_file_id: r.file?.id || null
        });
      }
    }
    let createdCount = 0;
    if (adsToInsert.length > 0) {
      const { data: insertedAds, error: errA } = await sb.from('ads').insert(adsToInsert).select();
      if (!errA && insertedAds) {
        const acToInsert = [];
        insertedAds.forEach(ad => enabled.forEach(cId => acToInsert.push({ ad_id: ad.id, country_id: cId, trad: false, meta: false })));
        if (acToInsert.length > 0) await sb.from('ad_countries').insert(acToInsert);
        createdCount = insertedAds.length;
      } else if (errA) { console.error('[CREATE ADS]', errA); }
    }
    for (const u of adsToUpdate) {
      await sb.from('ads').update({ concurrent_file_id: u.concurrent_file_id }).eq('id', u.id);
    }
    if (createdCount > 0) await logSync(`🎥 ${product.id} : ${createdCount} ad(s) créée(s) depuis Concurrent`, 'success');
  }

  // Si upload dans 00_Master_Ads → créer/lier les ads dans la DB
  if (targetFolderName === MASTER_FOLDER_NAME && okCount > 0) {
    const existingAdsByName = {};
    (existingAdsDb || []).forEach(a => { existingAdsByName[a.name.toLowerCase()] = a; });

    const adsToInsert = [];
    const adsToUpdate = [];
    for (const r of okResults) {
      const adNum = r.item.adNum;
      const adName = `Ad ${adNum}`;
      const existing = existingAdsByName[adName.toLowerCase()];
      if (existing) {
        // Ad existe déjà → on met juste à jour master_file_id
        adsToUpdate.push({ id: existing.id, master_file_id: r.file?.id || null });
      } else {
        // Nouvelle ad
        adsToInsert.push({
          product_id: product.id,
          name: adName,
          position: adNum,
          master_file_id: r.file?.id || null
        });
      }
    }

    let createdCount = 0, updatedCount = 0;
    if (adsToInsert.length > 0) {
      const { data: insertedAds, error: errA } = await sb.from('ads').insert(adsToInsert).select();
      if (!errA && insertedAds) {
        const acToInsert = [];
        insertedAds.forEach(ad => enabled.forEach(cId => acToInsert.push({ ad_id: ad.id, country_id: cId, trad: false, meta: false })));
        if (acToInsert.length > 0) await sb.from('ad_countries').insert(acToInsert);
        createdCount = insertedAds.length;
      }
    }
    for (const u of adsToUpdate) {
      await sb.from('ads').update({ master_file_id: u.master_file_id }).eq('id', u.id);
      updatedCount++;
    }
    if (createdCount > 0) await logSync(`🎬 ${product.id} : ${createdCount} ad(s) auto-créée(s)`, 'success');
    if (updatedCount > 0) await logSync(`🔄 ${product.id} : ${updatedCount} ad(s) re-liée(s)`, 'info');
  }

  if (okCount === 0 && items.length > 0) {
    const firstError = koResults[0]?.error || 'inconnue';
    await logSync(`❌ ${product.id} : TOUS les uploads ont échoué dans ${targetFolderName}. Erreur : ${firstError}`, 'error');
    toast(`❌ 0/${items.length} uploadé. Erreur : ${firstError}`, 'error', 8000);
  } else if (okCount < items.length) {
    await logSync(`⚠ ${product.id} : ${okCount}/${items.length} uploadés dans ${targetFolderName}`, 'warn');
    toast(`⚠ ${okCount}/${items.length} uploadé(s) — ${koResults.length} ont échoué`, 'warn', 6000);
  } else {
    await logSync(`📹 ${product.id} : ${okCount} fichier(s) uploadé(s) dans ${targetFolderName}`, 'success');
    toast(`✅ ${okCount} fichier(s) uploadé(s)`, 'success');
  }
  return results;
}

async function driveListFolderContent(folderId) {
  const r = await gapi.client.drive.files.list({
    q: `'${folderId}' in parents and trashed = false`,
    fields: 'files(id, name, mimeType)',
    pageSize: 1000
  });
  return r.result.files || [];
}

function extractGapiError(e) {
  if (!e) return 'Erreur inconnue';
  if (typeof e === 'string') return e;
  if (e.message) return e.message;
  if (e.result?.error?.message) return e.result.error.message;
  if (e.body) { try { return JSON.parse(e.body).error?.message || e.body; } catch { return e.body; } }
  return JSON.stringify(e);
}

async function syncDriveAll() {
  if (isSyncing) { toast('Sync déjà en cours...', 'warn'); return; }
  if (!driveState.connected) { toast('Pas connecté à Drive', 'error'); return; }
  isSyncing = true;
  const btn = document.getElementById('btn-sync-now');
  if (btn) { btn.disabled = true; btn.textContent = '🔄 Sync en cours...'; }
  const watchdog = setTimeout(() => {
    isSyncing = false;
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Sync maintenant'; }
    logSync('Watchdog: sync forcée à se terminer', 'error');
    toast('⚠ Sync timeout (60s)', 'warn');
  }, 60000);

  let totalFound = 0, totalNew = 0;
  try {
    const { data: products } = await sb.from('products').select('*');
    const { data: adsAll } = await sb.from('ads').select('*');
    for (const p of (products || [])) {
      if (!p.drive_folder_id) continue;
      try {
        const res = await syncDriveProduit(p, adsAll);
        totalFound += res.found;
        totalNew += res.marked;
      } catch (e) {
        await logSync(`Erreur sync ${p.id} : ${extractGapiError(e)}`, 'error');
      }
    }
    await sb.from('drive_config').update({ updated_at: new Date().toISOString() }).eq('id', 1);
    await logSync(`Sync globale : ${totalFound} fichiers scannés, ${totalNew} traduction(s)`, 'success');
    toast(`✅ Sync OK — ${totalNew} nouveau(x)`, 'success');
  } catch (e) {
    await logSync('Erreur sync : ' + extractGapiError(e), 'error');
    toast('Erreur : ' + extractGapiError(e), 'error');
  } finally {
    clearTimeout(watchdog);
    isSyncing = false;
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Sync maintenant'; }
    render();
  }
}

async function syncDriveProduit(p, adsAll) {
  let found = 0, marked = 0;
  const { data: countries } = await sb.from('countries').select('*');
  const subfolders = await driveListFolderContent(p.drive_folder_id);
  let pAds = adsAll.filter(a => a.product_id === p.id);
  const enabled = (p.enabled_countries?.length ? p.enabled_countries : countries.map(c => c.id));
  const now = new Date().toISOString();

  // 1. Scanner 00_Master_Ads → auto-créer les ads manquantes
  const masterFolder = subfolders.find(f => f.mimeType === 'application/vnd.google-apps.folder' && f.name === MASTER_FOLDER_NAME);
  if (masterFolder) {
    const masterFiles = await driveListFolderContent(masterFolder.id);
    const adsToCreate = [];
    for (const file of masterFiles) {
      if (file.mimeType === 'application/vnd.google-apps.folder') continue;
      const m = file.name.match(/Ad\s*(\d+)/i);
      if (!m) continue;
      const adNum = parseInt(m[1], 10);
      const adName = 'Ad ' + adNum;
      if (!pAds.find(a => a.name.toLowerCase() === adName.toLowerCase())) {
        adsToCreate.push({ product_id: p.id, name: adName, position: adNum, master_file_id: file.id });
      }
    }
    if (adsToCreate.length > 0) {
      const { data: inserted } = await sb.from('ads').insert(adsToCreate).select();
      if (inserted && inserted.length > 0) {
        // Créer les ad_countries pour chaque
        const acToInsert = [];
        inserted.forEach(ad => enabled.forEach(cId => acToInsert.push({ ad_id: ad.id, country_id: cId, trad: false, meta: false })));
        await sb.from('ad_countries').insert(acToInsert);
        await logSync(`🎬 ${p.id} : ${inserted.length} ad(s) auto-créée(s) depuis Masters`, 'success');
        // Recharge les ads locales
        pAds = [...pAds, ...inserted];
        found += inserted.length;
      }
    }
  }

  // 2. Scanner les dossiers pays → auto-check Trad
  for (const cf of subfolders) {
    if (cf.mimeType !== 'application/vnd.google-apps.folder') continue;
    const country = countries.find(c => c.id.toUpperCase() === cf.name.toUpperCase());
    if (!country) continue;
    const files = await driveListFolderContent(cf.id);
    for (const file of files) {
      if (file.mimeType === 'application/vnd.google-apps.folder') continue;
      const match = file.name.match(/Ad\s*(\d+)/i);
      if (!match) continue;
      const adName = 'Ad ' + parseInt(match[1], 10);
      const ad = pAds.find(a => a.name.toLowerCase() === adName.toLowerCase());
      if (!ad) continue;
      found++;
      const { data: existing } = await sb.from('ad_countries').select('*').eq('ad_id', ad.id).eq('country_id', country.id).maybeSingle();
      if (!existing?.trad) {
        if (existing) {
          await sb.from('ad_countries').update({ trad: true, trad_at: now, drive_file_id: file.id, updated_at: now, updated_by: currentUser.id }).eq('ad_id', ad.id).eq('country_id', country.id);
        } else {
          await sb.from('ad_countries').insert({ ad_id: ad.id, country_id: country.id, trad: true, trad_at: now, drive_file_id: file.id, updated_by: currentUser.id });
        }
        marked++;
        await logSync(`✅ ${p.id} / ${country.id} / ${adName} marqué traduit`, 'success');
      }
    }
  }
  return { found, marked };
}

function setupAutoSync() {
  clearInterval(autoSyncTimer);
  (async () => {
    const { data: cfg } = await sb.from('drive_config').select('*').eq('id', 1).single();
    // Auto-sync interval is stored client-side in localStorage for now (per user pref)
    const interval = parseInt(localStorage.getItem('keycorp_autosync_interval') || '15', 10);
    const enabled = localStorage.getItem('keycorp_autosync_enabled') === 'true';
    if (enabled && driveState.connected && interval >= 5) {
      autoSyncTimer = setInterval(() => { if (driveState.connected) syncDriveAll(); }, interval * 60 * 1000);
      logSync(`Sync auto activée (${interval} min)`, 'info');
    }
  })();
}

      });
    }
    if (!items.length) html = '<div style="padding:30px;text-align:center;color:var(--text-mute);font-size:13px">Aucun résultat</div>';
    results.innerHTML = html;
    selected = 0;
    updateSelected();
  }
  function updateSelected() {
    results.querySelectorAll('.cmdk-item').forEach((el, i) => el.classList.toggle('selected', i === selected));
    const selEl = results.querySelectorAll('.cmdk-item')[selected];
    if (selEl) selEl.scrollIntoView({ block: 'nearest' });
  }
  function pickCurrent() {
    if (!items.length) return;
    items[selected].action();
    closeCmdk();
  }
  function closeCmdk() {
    backdrop.remove();
    cmdkOpen = false;
  }
  input.addEventListener('input', renderResults);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); selected = Math.min(selected + 1, items.length - 1); updateSelected(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); selected = Math.max(selected - 1, 0); updateSelected(); }
    else if (e.key === 'Enter') { e.preventDefault(); pickCurrent(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeCmdk(); }
  });
  results.addEventListener('click', (e) => {
    const it = e.target.closest('.cmdk-item');
    if (it) { selected = parseInt(it.dataset.idx, 10); pickCurrent(); }
  });
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeCmdk(); });
  renderResults();
}

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    if (currentUser) openCmdk();
  }
});

function detectLinkSource(url) {
  if (!url) return null;
  const host = (url.match(/^https?:\/\/([^\/]+)/) || [])[1] || '';
  if (/afterlib/i.test(host)) return { icon: '🧪', name: 'AfterLib' };
  if (/facebook|fb\.com/i.test(host)) return { icon: '📘', name: 'Facebook' };
  if (/tiktok/i.test(host)) return { icon: '🎵', name: 'TikTok' };
  if (/youtube|youtu\.be/i.test(host)) return { icon: '▶️', name: 'YouTube' };
  if (/trendtrack/i.test(host)) return { icon: '📈', name: 'TrendTrack' };
  if (/minea/i.test(host)) return { icon: '🔎', name: 'Minea' };
  if (/adheart/i.test(host)) return { icon: '❤️', name: 'AdHeart' };
  if (/bigspy|adspy/i.test(host)) return { icon: '🕵️', name: 'AdSpy' };
  return { icon: '🔗', name: host };
}

/* ============================================================
   FEATURE: BATCH DRAG SELECT ON META CELLS
   ============================================================ */
let _metaMouseupHandler = null;
const DRAG_THRESHOLD = 5; // pixels avant de considérer qu'on drag vraiment

function setupMetaDragSelect(container) {
  let dragging = false;
  let startCell = null;
  let startX = 0, startY = 0;
  let selectedCells = new Set();

  // Remove previous global listener si existe (évite duplication à chaque render)
  if (_metaMouseupHandler) {
    document.removeEventListener('mouseup', _metaMouseupHandler);
    _metaMouseupHandler = null;
  }

  function getMetaCells() {
    return Array.from(container.querySelectorAll('.check-cell[data-toggle-meta]'));
  }
  function clearSelection() {
    getMetaCells().forEach(c => c.classList.remove('batch-selected'));
    selectedCells.clear();
    hideBar();
  }
  function getCellBounds(cell) {
    const rect = cell.getBoundingClientRect();
    return { left: rect.left, right: rect.right, top: rect.top, bottom: rect.bottom };
  }
  function rectsIntersect(a, b) {
    return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
  }
  function updateSelection(endX, endY) {
    const startRect = startCell.getBoundingClientRect();
    const sel = {
      left: Math.min(startRect.left + startRect.width/2, endX),
      right: Math.max(startRect.left + startRect.width/2, endX),
      top: Math.min(startRect.top + startRect.height/2, endY),
      bottom: Math.max(startRect.top + startRect.height/2, endY)
    };
    getMetaCells().forEach(c => {
      const b = getCellBounds(c);
      if (rectsIntersect(sel, b)) {
        c.classList.add('batch-selected');
        selectedCells.add(c.dataset.toggleMeta);
      } else if (c !== startCell) {
        c.classList.remove('batch-selected');
        selectedCells.delete(c.dataset.toggleMeta);
      }
    });
  }

  container.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return; // seulement clic gauche
    const cell = e.target.closest('.check-cell[data-toggle-meta]');
    if (!cell) return;
    if (!canEdit()) return;
    startCell = cell;
    startX = e.clientX;
    startY = e.clientY;
    dragging = false;
    // PAS d'highlight tant qu'on n'a pas bougé au-delà du threshold
  });
  container.addEventListener('mousemove', (e) => {
    if (!startCell) return;
    const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
    if (!dragging && dist < DRAG_THRESHOLD) return; // pas encore un drag
    if (!dragging) {
      // Début réel du drag : highlight la cellule de départ
      dragging = true;
      startCell.classList.add('batch-selected');
      selectedCells.add(startCell.dataset.toggleMeta);
    }
    updateSelection(e.clientX, e.clientY);
  });
  _metaMouseupHandler = async (e) => {
    if (!startCell) return;
    const wasDrag = dragging;
    const cellsToAct = Array.from(selectedCells);
    const start = startCell;
    startCell = null;
    dragging = false;
    if (!wasDrag) {
      // Simple clic : toggle (aucun highlight bleu n'a été appliqué)
      const [adId, cId] = start.dataset.toggleMeta.split('|');
      await toggleMetaCell(adId, cId);
      return;
    }
    if (cellsToAct.length <= 1) {
      clearSelection();
      return;
    }
    // Drag multi : afficher la barre
    showBatchBar(cellsToAct);
  };
  document.addEventListener('mouseup', _metaMouseupHandler);

  function hideBar() {
    document.querySelectorAll('.batch-action-bar').forEach(b => b.remove());
  }
  function showBatchBar(cells) {
    hideBar();
    const bar = document.createElement('div');
    bar.className = 'batch-action-bar';
    bar.innerHTML = `
      <div class="bab-count"><strong>${cells.length}</strong> case${cells.length > 1 ? 's' : ''} Meta sélectionnée${cells.length > 1 ? 's' : ''}</div>
      <button class="bab-check">✅ Tout cocher</button>
      <button class="bab-uncheck">❌ Tout décocher</button>
      <button>✂️ Inverser</button>
      <button class="bab-cancel">Annuler</button>
    `;
    document.body.appendChild(bar);
    const [b1, b2, b3, b4] = bar.querySelectorAll('button');
    b1.addEventListener('click', () => batchApply(cells, 'check'));
    b2.addEventListener('click', () => batchApply(cells, 'uncheck'));
    b3.addEventListener('click', () => batchApply(cells, 'toggle'));
    b4.addEventListener('click', () => { clearSelection(); });
    document.addEventListener('keydown', function escHandler(e) {
      if (e.key === 'Escape') { clearSelection(); document.removeEventListener('keydown', escHandler); }
    });
  }

  async function batchApply(cells, mode) {
    const now = new Date().toISOString();
    // Fetch current states
    const parsed = cells.map(s => { const [adId, cId] = s.split('|'); return { adId, cId }; });
    const adIds = [...new Set(parsed.map(p => p.adId))];
    const { data: current } = await sb.from('ad_countries').select('*').in('ad_id', adIds);
    const currentMap = {};
    (current || []).forEach(ac => { currentMap[ac.ad_id + '|' + ac.country_id] = ac; });

    for (const { adId, cId } of parsed) {
      const existing = currentMap[adId + '|' + cId];
      let newVal;
      if (mode === 'check') newVal = true;
      else if (mode === 'uncheck') newVal = false;
      else newVal = !(existing?.meta); // toggle
      if (existing) {
        await sb.from('ad_countries').update({ meta: newVal, meta_at: newVal ? now : null, updated_at: now, updated_by: currentUser.id }).eq('ad_id', adId).eq('country_id', cId);
      } else {
        await sb.from('ad_countries').insert({ ad_id: adId, country_id: cId, meta: newVal, meta_at: newVal ? now : null, updated_by: currentUser.id });
      }
    }
    toast(`${cells.length} case(s) mises à jour`, 'success');
    clearSelection();
    render();
  }
}

async function toggleMetaCell(adId, cId) {
  if (!canEdit()) { toast('Permission refusée', 'error'); return; }
  const { data: existing } = await sb.from('ad_countries').select('*').eq('ad_id', adId).eq('country_id', cId).maybeSingle();
  const newMeta = !(existing?.meta);
  const now = new Date().toISOString();
  if (existing) {
    await sb.from('ad_countries').update({ meta: newMeta, meta_at: newMeta ? now : null, updated_at: now, updated_by: currentUser.id }).eq('ad_id', adId).eq('country_id', cId);
  } else {
    await sb.from('ad_countries').insert({ ad_id: adId, country_id: cId, meta: newMeta, meta_at: newMeta ? now : null, updated_by: currentUser.id });
  }
  render();
}

/* ============================================================
   INIT
   ============================================================ */
(async function init() {
  // Détecte si l'user vient d'un lien d'invitation ou de reset password
  const hash = window.location.hash;
  const isInviteOrReset = hash.includes('type=invite') || hash.includes('type=recovery');
  // Check Shopify callback flag (si on revient d'une connexion OAuth)
  checkShopifyCallbackFlag();

  // Check if already logged in
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    if (isInviteOrReset) {
      // L'user vient d'une invitation → force à créer son mdp
      await promptSetPasswordAfterInvite(session.user);
      window.location.hash = '';
    }
    await initApp(session.user);
  }
  // Listen for auth changes (important pour l'invitation : onAuthStateChange fire après que Supabase parse le hash)
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_OUT' && currentUser) {
      currentUser = null;
      currentProfile = null;
      document.getElementById('app').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
    } else if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session?.user && !currentUser) {
      if (isInviteOrReset) {
        await promptSetPasswordAfterInvite(session.user);
        window.location.hash = '';
      }
      await initApp(session.user);
    }
  });
})();

async function promptSetPasswordAfterInvite(user) {
  const r = await modal(`
    <div class="modal-title">🎉 Bienvenue sur Key Corp !</div>
    <div class="text-sm text-dim mb-md">Pour finaliser ton inscription (${escapeHtml(user.email)}), crée ton mot de passe :</div>
    <div class="input-group">
      <label class="input-label">Nouveau mot de passe</label>
      <input type="password" class="input" data-field="pwd1" placeholder="Min 6 caractères" autofocus>
    </div>
    <div class="input-group">
      <label class="input-label">Confirmer</label>
      <input type="password" class="input" data-field="pwd2" placeholder="Retape-le">
    </div>
    <div class="modal-actions">
      <button class="btn btn-block" data-modal-ok>Activer mon compte</button>
    </div>
  `);
  if (!r || !r.pwd1 || r.pwd1.length < 6) { toast('Mot de passe trop court', 'error'); return promptSetPasswordAfterInvite(user); }
  if (r.pwd1 !== r.pwd2) { toast('Les mots de passe ne correspondent pas', 'error'); return promptSetPasswordAfterInvite(user); }
  const { error } = await sb.auth.updateUser({ password: r.pwd1 });
  if (error) { toast('Erreur : ' + error.message, 'error'); return promptSetPasswordAfterInvite(user); }
  toast('✅ Compte activé, bienvenue !', 'success', 5000);
}
