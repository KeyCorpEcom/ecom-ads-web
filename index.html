<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Corp — Ecommerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
:root{
  --bg:#08080c;--bg-card:#12121a;--bg-card-hover:#1a1a24;--bg-input:#0c0c12;
  --border:#2a2a3a;--border-soft:#1e1e28;
  --text:#e5e5ea;--text-dim:#8a8a9a;--text-mute:#5a5a6a;
  --gold:#c8a55a;--gold-dim:#8a7340;
  --green:#34d399;--red:#f87171;--orange:#fbbf24;--blue:#60a5fa;--purple:#c084fc;
  --shadow:0 4px 12px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}
a{color:var(--gold);text-decoration:none}

/* ============ LOGIN SCREEN ============ */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,#1a1a24 0%,#08080c 70%)}
.login-box{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:40px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo-main{font-size:22px;font-weight:800;color:var(--gold);letter-spacing:-0.02em;margin-bottom:4px}
.login-logo-sub{font-size:10px;color:var(--text-mute);text-transform:uppercase;letter-spacing:2px}
.login-title{font-size:18px;font-weight:700;margin-bottom:6px;text-align:center}
.login-subtitle{font-size:12px;color:var(--text-dim);text-align:center;margin-bottom:24px}

/* ============ APP LAYOUT ============ */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--bg-card);border-right:1px solid var(--border);padding:20px 14px;flex-shrink:0;display:flex;flex-direction:column}
.logo{font-size:18px;font-weight:800;color:var(--gold);padding:8px 12px;letter-spacing:-0.02em}
.logo-sub{font-size:11px;color:var(--text-mute);padding:0 12px;margin-bottom:24px;text-transform:uppercase;letter-spacing:1px}
.nav{flex:1}
.nav-section-label{font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.5px;padding:12px 12px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--text-dim);cursor:pointer;font-size:14px;font-weight:500;margin-bottom:2px;transition:all 0.15s;user-select:none;text-decoration:none}
.nav-item:hover{background:var(--bg-card-hover);color:var(--text)}
.nav-item.active{background:rgba(200,165,90,0.1);color:var(--gold)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.nav-badge{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:10px;background:var(--bg-input);color:var(--text-dim);font-weight:600}

.user-box{padding:12px;border-top:1px solid var(--border-soft);margin-top:8px}
.user-name{font-size:13px;font-weight:600;color:var(--text)}
.user-role{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px}
.user-role.admin{color:var(--gold)}
.user-role.editor{color:var(--green)}
.user-role.viewer{color:var(--blue)}
.user-role.page_builder{color:var(--purple)}
.btn-logout{width:100%;margin-top:10px;background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
.btn-logout:hover{background:var(--bg-input);color:var(--red);border-color:var(--red)}

.main{flex:1;padding:32px 40px;max-width:1700px;overflow-x:hidden}

.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:16px}
.page-title{font-size:26px;font-weight:700;letter-spacing:-0.02em}
.page-subtitle{color:var(--text-dim);font-size:14px;margin-top:4px}

/* ============ COMPONENTS ============ */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.card-title{font-size:15px;font-weight:600}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:18px}
.kpi-label{font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;font-weight:500}
.kpi-value{font-size:30px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:-0.02em;line-height:1}
.kpi-value.gold{color:var(--gold)}.kpi-value.green{color:var(--green)}.kpi-value.red{color:var(--red)}.kpi-value.blue{color:var(--blue)}
.kpi-sub{font-size:11px;color:var(--text-dim);margin-top:6px}

.btn{background:var(--gold);color:#0a0a0a;border:none;padding:10px 20px;border-radius:8px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-secondary{background:var(--bg-card);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg-card-hover);filter:none}
.btn-ghost{background:transparent;color:var(--text-dim);padding:6px 12px}
.btn-ghost:hover{background:var(--bg-card);color:var(--text);transform:none}
.btn-danger{background:var(--red);color:#fff}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none!important}
.btn-block{width:100%;justify-content:center}

.input,.select,textarea.input{background:var(--bg-input);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-family:inherit;font-size:13px;width:100%;transition:border-color 0.15s}
.input:focus,.select:focus,textarea.input:focus{border-color:var(--gold);outline:none}
.input-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.input-label{font-size:12px;color:var(--text-dim);font-weight:500}
.input-hint{font-size:11px;color:var(--text-mute);margin-top:2px}

/* Table */
.ads-table{width:100%;border-collapse:collapse;margin-top:16px}
.ads-table th,.ads-table td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--border-soft);font-size:13px}
.ads-table th{background:var(--bg);font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap}
.ads-table .ad-col{text-align:left;padding-left:16px;min-width:100px;font-weight:600;font-family:'JetBrains Mono',monospace}
.check-cell{cursor:pointer;user-select:none;transition:background 0.1s}
.check-cell:hover{background:rgba(255,255,255,0.05)}
.check-cell.auto{cursor:not-allowed;opacity:0.85}
.check-cell.readonly{cursor:not-allowed}
.check-icon{display:inline-block;width:22px;height:22px;border-radius:6px;background:var(--bg-input);border:1.5px solid var(--border);transition:all 0.15s;position:relative}
.check-icon.checked{background:var(--green);border-color:var(--green)}
.check-icon.checked::after{content:'';position:absolute;inset:4px 4px 4px 4px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>") center/contain no-repeat}
.check-icon.meta.checked{background:var(--blue);border-color:var(--blue)}
.check-icon.meta.checked::after{content:'🚀';background:none;inset:auto;font-size:14px;display:flex;align-items:center;justify-content:center;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}

/* Product grid */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.product-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:all 0.15s}
.product-card:hover{background:var(--bg-card-hover);border-color:var(--gold);transform:translateY(-2px)}
.product-card-title{font-size:18px;font-weight:700;color:var(--gold);margin-bottom:4px;font-family:'JetBrains Mono',monospace}
.product-card-sub{font-size:12px;color:var(--text-dim);margin-bottom:14px}

/* Users table (admin) */
.users-table{width:100%;border-collapse:collapse}
.users-table th,.users-table td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border-soft);font-size:13px}
.users-table th{background:var(--bg);font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px}

.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600}
.badge.admin{background:rgba(200,165,90,0.15);color:var(--gold)}
.badge.editor{background:rgba(52,211,153,0.15);color:var(--green)}
.badge.viewer{background:rgba(96,165,250,0.15);color:var(--blue)}
.badge.page_builder{background:rgba(192,132,252,0.15);color:var(--purple)}

.empty{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:0.5}
.empty-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:6px}

/* Toasts */
#toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px 18px;font-size:13px;box-shadow:var(--shadow);animation:slideIn 0.25s;min-width:260px}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}
.toast.info{border-left:3px solid var(--blue)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:24px;min-width:400px;max-width:600px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-soft)}

.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text-dim)}
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.flex{display:flex}.flex-between{display:flex;justify-content:space-between;align-items:center}
.gap-sm{gap:8px}.mt-md{margin-top:16px}.mb-md{margin-bottom:16px}
.text-dim{color:var(--text-dim)}.text-sm{font-size:12px}.text-right{text-align:right}.hidden{display:none!important}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.country-flag{width:22px;height:auto;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 1px rgba(255,255,255,0.08)}

.role-select{background:var(--bg-input);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:6px;font-size:12px;font-family:inherit}

/* Image gallery */
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.img-tile{position:relative;aspect-ratio:1;background:var(--bg);border:1px solid var(--border-soft);border-radius:8px;overflow:hidden;cursor:pointer;transition:all 0.15s}
.img-tile:hover{border-color:var(--gold);transform:scale(1.02)}
.img-tile img{width:100%;height:100%;object-fit:cover;display:block}
.img-tile-name{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.85));color:#fff;padding:12px 6px 5px;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:0.5px}
.img-tile-del{position:absolute;top:4px;right:4px;background:rgba(248,113,113,0.9);color:#fff;border:none;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:14px;opacity:0;transition:opacity 0.15s;display:flex;align-items:center;justify-content:center}
.img-tile:hover .img-tile-del{opacity:1}
.img-tile-del:hover{background:var(--red)}
.img-dropzone{padding:20px;background:var(--bg-input);border:2px dashed var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all 0.15s;margin-top:10px}
.img-dropzone:hover{border-color:var(--gold);background:rgba(200,165,90,0.05)}
.img-dropzone.dragover{border-color:var(--gold);background:rgba(200,165,90,0.15)}
.img-count-badge{display:inline-block;background:var(--bg-input);color:var(--text-dim);padding:3px 8px;border-radius:10px;font-size:11px;font-family:'JetBrains Mono',monospace;margin-left:6px}

.auth-error{background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.3);color:var(--red);padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:14px}

/* Command palette (Ctrl+K) */
.cmdk-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding-top:15vh;animation:fadeIn 0.15s}
.cmdk{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,0.6);overflow:hidden}
.cmdk-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border-soft);color:var(--text);padding:18px 20px;font-family:inherit;font-size:15px;outline:none}
.cmdk-input::placeholder{color:var(--text-mute)}
.cmdk-results{max-height:50vh;overflow-y:auto;padding:8px 0}
.cmdk-group-label{padding:8px 20px 4px;font-size:10px;color:var(--text-mute);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.cmdk-item{padding:8px 20px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px;transition:background 0.05s}
.cmdk-item:hover,.cmdk-item.selected{background:var(--bg-card-hover)}
.cmdk-item.selected{color:var(--gold)}
.cmdk-item-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.cmdk-item-main{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdk-item-sub{color:var(--text-mute);font-size:11px}
.cmdk-kbd{background:var(--bg-input);border:1px solid var(--border);padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim)}
.cmdk-footer{padding:10px 20px;border-top:1px solid var(--border-soft);font-size:11px;color:var(--text-mute);display:flex;gap:14px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Batch action bar (Excel-style drag Meta) */
.batch-action-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--gold);border-radius:12px;padding:12px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,0.6);z-index:500}
.batch-action-bar .bab-count{font-size:13px;color:var(--text);font-weight:600;padding-right:10px;border-right:1px solid var(--border)}
.batch-action-bar .bab-count strong{color:var(--gold);font-family:'JetBrains Mono',monospace}
.batch-action-bar button{padding:8px 12px;font-size:12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);cursor:pointer;font-weight:500;font-family:inherit}
.batch-action-bar button:hover{background:var(--bg-card-hover);border-color:var(--gold)}
.batch-action-bar .bab-check{background:rgba(52,211,153,0.15);border-color:rgba(52,211,153,0.4);color:var(--green)}
.batch-action-bar .bab-uncheck{background:rgba(248,113,113,0.12);border-color:rgba(248,113,113,0.35);color:var(--red)}
.batch-action-bar .bab-cancel{opacity:0.7}
.check-cell.batch-selected{background:rgba(96,165,250,0.2)!important;box-shadow:inset 0 0 0 2px var(--blue)}

/* Ad Copy icon */
.ad-copy-icon{display:inline-block;margin-left:8px;cursor:pointer;font-size:14px;color:var(--text-mute);transition:all 0.15s;user-select:none}
.ad-copy-icon:hover{color:var(--gold);transform:scale(1.1)}
.ad-copy-icon.filled{color:var(--gold)}
.ad-link-icon{display:inline-block;margin-left:6px;cursor:pointer;font-size:13px;text-decoration:none}
.ad-link-icon:hover{transform:scale(1.15)}

/* Drive sync status */
.sync-status{display:flex;align-items:center;gap:10px;font-size:13px}
.sync-dot{width:10px;height:10px;border-radius:50%;background:var(--text-mute)}
.sync-dot.connected{background:var(--green);box-shadow:0 0 0 3px rgba(52,211,153,0.2)}
.sync-dot.disconnected{background:var(--red)}
.sync-dot.syncing{background:var(--orange);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(251,191,36,0.4)}50%{opacity:0.6;box-shadow:0 0 0 8px rgba(251,191,36,0)}}
.toggle{position:relative;display:inline-block;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--bg-input);border:1px solid var(--border);border-radius:24px;transition:0.2s}
.toggle-slider::before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:var(--text-dim);border-radius:50%;transition:0.2s}
.toggle input:checked+.toggle-slider{background:var(--gold);border-color:var(--gold)}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px);background:#000}
.log-list{max-height:500px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:8px;background:var(--bg-input)}
.log-entry{padding:10px 14px;border-bottom:1px solid var(--border-soft);font-size:12px;display:flex;justify-content:space-between;gap:12px}
.log-entry:last-child{border-bottom:none}
.log-time{color:var(--text-mute);font-family:'JetBrains Mono',monospace;font-size:11px;white-space:nowrap}
.log-msg{flex:1}
.log-entry.success .log-msg{color:var(--green)}
.log-entry.error .log-msg{color:var(--red)}
.log-entry.info .log-msg{color:var(--text)}

/* Cut country columns in table */
.ads-table th.cut, .ads-table td.cut{opacity:0.35;position:relative}
.ads-table th.cut{text-decoration:line-through;color:var(--red)!important}
.ads-table td.cut.check-cell{cursor:not-allowed!important;pointer-events:none}
.ads-table th.cut-badge{position:relative}
.ads-table th.cut-badge::after{content:'✂ COUPÉ';position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--red);font-weight:700;letter-spacing:1px}
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-main">KEY CORP</div>
      <div class="login-logo-sub">ECOMMERCE</div>
    </div>
    <div class="login-title">Connexion</div>
    <div class="login-subtitle">Connecte-toi avec ton compte</div>
    <div id="auth-error" class="auth-error hidden"></div>
    <form id="login-form">
      <div class="input-group">
        <label class="input-label">Email</label>
        <input type="email" class="input" id="login-email" required autofocus>
      </div>
      <div class="input-group">
        <label class="input-label">Mot de passe</label>
        <input type="password" class="input" id="login-password" required>
      </div>
      <button type="submit" class="btn btn-block" id="login-btn">Se connecter</button>
    </form>
    <div style="margin-top:16px;text-align:center">
      <a href="#" id="link-forgot" style="font-size:12px;color:var(--text-dim)">Mot de passe oublié ?</a>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="logo">KEY CORP</div>
    <div class="logo-sub">ECOMMERCE</div>
    <nav class="nav">
      <div class="nav-section-label">Vue d'ensemble</div>
      <a class="nav-item" id="btn-open-cmdk" style="cursor:pointer"><span class="nav-icon">🔍</span>Rechercher<span class="cmdk-kbd" style="margin-left:auto">Ctrl+K</span></a>

const SUPABASE_URL = 'https://pxzfjnsngtjzfqmahgaj.supabase.co';

/* ============================================================

function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(n) { return Number(n || 0).toLocaleString('fr-FR'); }
function pct(a, b) { return b === 0 ? 0 : Math.round((a / b) * 100); }
function flagImg(countryId) {
  const ISO_BY_ID = { UK: 'gb', EL: 'gr' };
  const iso = (ISO_BY_ID[countryId] || countryId || '').toLowerCase();
  return `<img src="https://flagcdn.com/w40/${iso}.png" class="country-flag" alt="${escapeHtml(countryId)}" onerror="this.style.display='none'">`;
}

function toast(msg, type = 'info', duration = 3000) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const icon = { success: '✅', error: '⚠️', info: 'ℹ️' }[type] || '';
  t.innerHTML = `<span>${icon}</span> <span>${escapeHtml(msg)}</span>`;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, duration);
}

function modal(contentHtml) {
  return new Promise(resolve => {
    const container = document.getElementById('modal-container');
    const bd = document.createElement('div');
    bd.className = 'modal-backdrop';
    bd.innerHTML = `<div class="modal">${contentHtml}</div>`;
    container.appendChild(bd);
    const close = (r) => { if (bd.parentNode) bd.remove(); resolve(r); };
    bd.addEventListener('click', (e) => { if (e.target === bd) close(null); });
    bd.querySelectorAll('[data-modal-close]').forEach(el => el.addEventListener('click', () => close(null)));
    bd.querySelectorAll('[data-clear-copy]').forEach(el => el.addEventListener('click', () => close('clear')));
    bd.querySelectorAll('[data-modal-ok]').forEach(el => el.addEventListener('click', () => {
      const r = {};
      bd.querySelectorAll('[data-field]').forEach(f => { r[f.dataset.field] = f.value; });
      close(r);
    }));
    setTimeout(() => bd.querySelector('input:not([type=color]):not([type=date]):not([type=checkbox]),textarea,select')?.focus(), 50);
  });
}

function confirmDialog(title, msg) {
  return modal(`
    <div class="modal-title">${escapeHtml(title)}</div>
    <div class="text-dim text-sm">${escapeHtml(msg)}</div>

      <button class="btn btn-secondary" data-modal-close>Annuler</button>

  `).then(r => !!r);
}

document.getElementById('btn-change-password').addEventListener('click', async () => {
  const r = await modal(`

    <div class="text-sm text-dim mb-md">Choisis un nouveau mot de passe fort (min 6 caractères).</div>

  if (!r) return;
  if (!r.pwd1 || r.pwd1.length < 6) { toast('Mot de passe trop court (min 6 caractères)', 'error'); return; }
  if (r.pwd1 !== r.pwd2) { toast('Les 2 mots de passe ne correspondent pas', 'error'); return; }

function getRoute() {
  const h = location.hash.slice(1) || 'dashboard';
  const [page, ...params] = h.split('/');
  return { page, params };
}
function navigate(route) { location.hash = '#' + route; }

async function render() {
  const { page, params } = getRoute();

  // Si page_builder : restriction à la page Pages uniquement
  if (currentProfile?.role === 'page_builder' && page !== 'pages') {
    navigate('pages');
    return;
  }

  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.route === page || (page === 'produit' && el.dataset.route === 'produits'));
  });

  const driveBadge = document.getElementById('nav-drive-status');

    driveBadge.style.background = driveState.connected ? 'transparent' : '';
  }
  const el = document.getElementById('page');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    if (page === 'dashboard') await renderDashboard(el);
    else if (page === 'produits') await renderProduits(el);
    else if (page === 'ads') await renderAds(el);
    else if (page === 'produit') await renderProduit(el, params[0]);
    else if (page === 'analytics') await renderAnalytics(el);
    else if (page === 'pages') {
      if (params[0]) await renderPageProduct(el, params[0]);
      else await renderPagesHome(el);
    }
    else if (page === 'drive') await renderDrive(el);
    else if (page === 'users') await renderUsers(el);
    else if (page === 'parametres') await renderSettings(el);
    else el.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Page introuvable</div></div>';
  } catch (e) {
    console.error(e);
    el.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Erreur</div><div class="text-dim">${escapeHtml(e.message)}</div></div>`;
  }
}

async function renderDashboard(el) {
  const { countries, products, ads, adCountries } = await fetchAll();

  const doneMeta = adCountries.filter(x => x.meta).length;

  const byCountry = {};
  countries.forEach(c => { byCountry[c.id] = { trad: 0, meta: 0, total: ads.length }; });
  adCountries.forEach(ac => {
    if (!byCountry[ac.country_id]) return;
    if (ac.trad) byCountry[ac.country_id].trad++;
    if (ac.meta) byCountry[ac.country_id].meta++;
  });

  el.innerHTML = `
    <div class="page-head">
      <div>
        <div class="page-title">Dashboard</div>
        <div class="page-subtitle">Vue d'ensemble multi-utilisateurs</div>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Produits</div>
        <div class="kpi-value gold">${fmt(products.length)}</div>
        <div class="kpi-sub">${fmt(ads.length)} ads au total</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Traductions</div>
        <div class="kpi-value green">${fmt(doneTrad)}</div>
        <div class="kpi-sub">${pct(doneTrad, total)}% complété</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Lancements Meta</div>
        <div class="kpi-value blue">${fmt(doneMeta)}</div>
        <div class="kpi-sub">${pct(doneMeta, total)}% complété</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Pays</div>
        <div class="kpi-value">${fmt(countries.length)}</div>
        <div class="kpi-sub">${countries.map(c => c.id).join(' · ')}</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-head">
          <div class="card-title">📊 Traductions par pays</div>
        </div>
        ${countries.map(c => {
          const s = byCountry[c.id];
          const p = pct(s.trad, s.total);
          return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
            <div style="width:80px;display:flex;align-items:center">${flagImg(c.id)}${c.id}</div>
            <div style="flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden"><div style="width:${p}%;height:100%;background:${c.color};transition:width 0.4s"></div></div>
            <div class="mono text-sm text-dim" style="min-width:70px;text-align:right">${s.trad}/${s.total}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="card">
        <div class="card-head">
          <div class="card-title">🚀 Lancements Meta</div>
        </div>
        ${countries.map(c => {
          const s = byCountry[c.id];
          const p = pct(s.meta, s.total);
          return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
            <div style="width:80px;display:flex;align-items:center">${flagImg(c.id)}${c.id}</div>
            <div style="flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden"><div style="width:${p}%;height:100%;background:var(--blue);transition:width 0.4s"></div></div>
            <div class="mono text-sm text-dim" style="min-width:70px;text-align:right">${s.meta}/${s.total}</div>
          </div>`;
        }).join('')}
      </div>

}

/* ============================================================
   PAGE: PRODUITS
   ============================================================ */
async function renderAds(el) {
  const { countries, products, ads, adCountries } = await fetchAll();
  const adsByProduct = {};
  products.forEach(p => adsByProduct[p.id] = ads.filter(a => a.product_id === p.id));
  const acByAd = {};
  adCountries.forEach(ac => {
    if (!acByAd[ac.ad_id]) acByAd[ac.ad_id] = {};
    acByAd[ac.ad_id][ac.country_id] = ac;
  });

  // Tri : priorité DESC puis date DESC
  const sorted = [...products].sort((a, b) => {
    const pa = PRIORITY_META[a.priority]?.weight || 2;
    const pb = PRIORITY_META[b.priority]?.weight || 2;
    if (pa !== pb) return pb - pa;
    return new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime();
  });

  el.innerHTML = `
    <div class="page-head">
      <div>
        <div class="page-title">📺 Ads</div>
        <div class="page-subtitle">${fmt(products.length)} produit(s) · ${fmt(ads.length)} ads</div>
      </div>
      ${isAdmin() ? '<button class="btn" id="btn-new-product">+ Nouveau produit</button>' : ''}
    </div>
    ${products.length === 0 ? `
      <div class="empty">
        <div class="empty-icon">📺</div>
        <div class="empty-title">Aucun produit</div>
      </div>
    ` : `
      <div class="product-grid">
        ${sorted.map(p => {
          const pAds = adsByProduct[p.id] || [];
          const enabled = (p.enabled_countries && p.enabled_countries.length) ? p.enabled_countries : countries.map(c => c.id);
          const cuts = p.cut_countries || [];
          const activeCs = enabled.filter(cId => !cuts.includes(cId));
          const total = pAds.length * activeCs.length;
          let trad = 0;
          pAds.forEach(ad => {
            activeCs.forEach(cId => {
              const ac = (acByAd[ad.id] || {})[cId];
              if (ac?.trad) trad++;
            });
          });
          const tradPct = pct(trad, total);
          const priority = p.priority || 'normal';
          const priorityMeta = PRIORITY_META?.[priority] || { color: '#60a5fa' };

          return `
            <div class="product-card" data-goto="${p.id}" style="border-left:4px solid ${priorityMeta.color}">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:8px">
                <div class="product-card-title">${escapeHtml(p.id)}</div>
                ${priority !== 'normal' ? priorityBadge(priority) : ''}
              </div>
              <div class="product-card-sub">${escapeHtml(p.name || '')}${p.name ? ' · ' : ''}${fmt(pAds.length)} ads · ${activeCs.length} pays</div>

              <div style="margin-top:10px">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;font-size:11px">
                  <span style="color:var(--text-dim)">📺 Trad ads</span>
                  <span class="mono" style="color:var(--green);font-weight:600">${trad}/${total} · ${tradPct}%</span>
                </div>
                <div style="height:5px;background:var(--bg);border-radius:3px;overflow:hidden"><div style="width:${tradPct}%;height:100%;background:var(--green);transition:width 0.4s"></div></div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `}
  `;

  el.querySelectorAll('[data-goto]').forEach(c => c.addEventListener('click', () => navigate('produit/' + c.dataset.goto)));
  document.getElementById('btn-new-product')?.addEventListener('click', newProductFlow);
}

async function renderProduits(el) {
  const { countries, products, ads, adCountries } = await fetchAll();
  const { data: pagesAll } = await sb.from('product_pages').select('product_id, country_id, status');
  const adsByProduct = {};
  products.forEach(p => adsByProduct[p.id] = ads.filter(a => a.product_id === p.id));
  const acByAd = {};
  adCountries.forEach(ac => {
    if (!acByAd[ac.ad_id]) acByAd[ac.ad_id] = {};
    acByAd[ac.ad_id][ac.country_id] = ac;
  });
  const pagesByProduct = {};
  (pagesAll || []).forEach(p => {
    if (!pagesByProduct[p.product_id]) pagesByProduct[p.product_id] = {};
    pagesByProduct[p.product_id][p.country_id] = p.status;
  });

  el.innerHTML = `
    <div class="page-head">
      <div>
        <div class="page-title">📦 Produits</div>
        <div class="page-subtitle">${fmt(products.length)} produit(s) · ${fmt(ads.length)} ads</div>
      </div>
      ${isAdmin() ? '<button class="btn" id="btn-new-product">+ Nouveau produit</button>' : ''}
    </div>
    ${products.length === 0 ? `
      <div class="empty">
        <div class="empty-icon">📦</div>
        <div class="empty-title">Aucun produit</div>
      </div>
    ` : `
      <div class="product-grid">
        ${products.map(p => {
          const pAds = adsByProduct[p.id] || [];
          const enabled = (p.enabled_countries && p.enabled_countries.length) ? p.enabled_countries : countries.map(c => c.id);
          const cuts = p.cut_countries || [];
          const activeCs = enabled.filter(cId => !cuts.includes(cId));
          const total = pAds.length * activeCs.length;
          let trad = 0, meta = 0;
          pAds.forEach(ad => {
            activeCs.forEach(cId => {
              const ac = (acByAd[ad.id] || {})[cId];
              if (ac?.trad) trad++;
              if (ac?.meta) meta++;
            });
          });
          // Progression Pages Landing
          const pgs = pagesByProduct[p.id] || {};
          const pagesApproved = activeCs.filter(cId => pgs[cId] === 'approved').length;
          const pagesPct = pct(pagesApproved, activeCs.length);
          const tradPct = pct(trad, total);
          const metaPct = pct(meta, total);
          const priority = p.priority || 'normal';
          const priorityMeta = PRIORITY_META?.[priority] || { color: '#60a5fa' };

          return `
            <div class="product-card" data-goto="${p.id}" style="border-left:4px solid ${priorityMeta.color}">

                  </div>

        }).join('')}

  el.querySelectorAll('[data-goto]').forEach(c => c.addEventListener('click', () => navigate('produit/' + c.dataset.goto)));
  document.getElementById('btn-new-product')?.addEventListener('click', newProductFlow);
}

function computeDefaultMaster(enabledCountries) {
  if (enabledCountries.includes('FR')) return 'FR';
  if (enabledCountries.includes('IT')) return 'IT';
  return enabledCountries[0] || null;
}

async function newProductFlow() {
  if (!isAdmin()) { toast('Seul un admin peut créer un produit', 'error'); return; }
  const { data: allCountries } = await sb.from('countries').select('*').order('sort_order');
  const selectedCountries = allCountries.map(c => c.id);
  let concurrentFiles = [];
  let masterCountry = computeDefaultMaster(selectedCountries);
  const countriesHtml = allCountries.map(c => `
    <label style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;user-select:none;font-size:12px;background:${c.color}22;color:${c.color};border:1px solid ${c.color}44">

  const r = await modalWithOpen(`

    </div>

      <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;user-select:none">
        <input type="checkbox" data-field="autoCreateDrive" checked style="margin:4px 0 0 0;accent-color:var(--gold);flex-shrink:0" ${!driveState.connected ? 'disabled' : ''}>
        <div>
          <div style="font-weight:600;display:flex;align-items:center;gap:6px">☁️ Créer automatiquement la structure Drive</div>
          <div class="text-sm text-dim" style="margin-top:2px">Crée <span class="mono">F00XX/</span> avec <span class="mono">00_Ads_Concurrent/</span> + <span class="mono">00_Master_Ads/</span> + sous-dossiers par marché (FR, DE, ...) dans ton dossier racine</div>
          ${!driveState.connected ? '<div class="text-sm" style="color:var(--red);margin-top:4px">⚠ Connecte-toi à Drive d\'abord pour utiliser cette option</div>' : ''}
        </div>
      </label>
    </div>
    <div class="input-group">
      <label class="input-label">🌍 Marchés actifs</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--bg-input);border-radius:8px;border:1px solid var(--border)">
        ${countriesHtml}
      </div>
      <div class="input-hint">Décoche les pays où tu ne lances pas ce produit (tu pourras modifier plus tard).</div>
    </div>
    <div class="input-group">
      <label class="input-label">🏁 Pays Master (optionnel — référence interne)</label>
      <select class="select" id="master-country-select">
        ${masterSelectHtml}
      </select>
      <div class="input-hint">Indique juste quel pays sert de référence. Pas d'impact sur le workflow actuel.</div>
    </div>
    <div class="input-group">
      <label class="input-label">⚡ Priorité</label>
      <select class="select" data-field="priority">
        <option value="urgent">🔴 URGENT</option>
        <option value="high">🟠 HAUTE</option>
        <option value="normal" selected>🔵 NORMALE</option>
        <option value="low">⚪ BASSE</option>
      </select>
      <div class="input-hint">Les produits à priorité haute remontent en haut de Product Page et Ads.</div>

      <label class="input-label">🎬 Upload videos concurrent (optionnel)</label>

        <div style="font-weight:600;margin-bottom:4px">Glisse les videos du concurrent ici ou clique</div>
        <div class="text-sm text-dim">Videos brutes (avec sous-titres) · MP4, MOV, AVI, images</div>
        <input type="file" id="new-product-files" multiple style="display:none" accept="video/*,image/*">
        <div id="new-product-files-list" style="margin-top:10px"></div>
      </div>
      <div class="input-hint">Les videos seront uploadées dans <span class="mono">00_Ads_Concurrent/</span>. Ton video editor les récupèrera, supprimera les sous-titres, puis déposera les versions propres dans <span class="mono">00_Master_Ads/</span> (qui créera auto les ads dans l'app).</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" data-modal-close>Annuler</button>
      <button class="btn" data-modal-ok>Créer</button>
    </div>
  `, (bd) => {
    const masterSel = bd.querySelector('#master-country-select');
    bd.querySelectorAll('[data-new-country-check]').forEach(cb => {
      cb.addEventListener('change', () => {
        const cid = cb.dataset.newCountryCheck;
        if (cb.checked) { if (!selectedCountries.includes(cid)) selectedCountries.push(cid); }
        else { const i = selectedCountries.indexOf(cid); if (i >= 0) selectedCountries.splice(i, 1); }
        // Si le master est décoché, on auto-change
        if (!selectedCountries.includes(masterCountry)) {
          masterCountry = computeDefaultMaster(selectedCountries);
          if (masterSel) masterSel.value = masterCountry || '';
        }
      });
    });
    if (masterSel) masterSel.addEventListener('change', () => { masterCountry = masterSel.value; });
    // Dropzone
    const dz = bd.querySelector('#new-product-dropzone');
    const input = bd.querySelector('#new-product-files');
    const list = bd.querySelector('#new-product-files-list');
    const refreshList = () => {
      if (concurrentFiles.length === 0) { list.innerHTML = ''; return; }
      list.innerHTML = '<div style="text-align:left;padding:10px 0 0 0;border-top:1px solid var(--border-soft);margin-top:10px">' +

        '</div>';
      list.querySelectorAll('[data-remove-file]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); concurrentFiles.splice(parseInt(b.dataset.removeFile, 10), 1); refreshList(); }));
    };
    if (driveState.connected) {
      dz.addEventListener('click', (e) => { if (e.target.tagName !== 'INPUT' && !e.target.closest('[data-remove-file]')) input.click(); });
      input.addEventListener('change', (e) => { concurrentFiles = concurrentFiles.concat(Array.from(e.target.files)); refreshList(); e.target.value = ''; });
      dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.style.borderColor = 'var(--gold)'; dz.style.background = 'rgba(200,165,90,0.1)'; });
      dz.addEventListener('dragleave', () => { dz.style.borderColor = ''; dz.style.background = ''; });
      dz.addEventListener('drop', (e) => { e.preventDefault(); dz.style.borderColor = ''; dz.style.background = ''; concurrentFiles = concurrentFiles.concat(Array.from(e.dataTransfer.files)); refreshList(); });
    }
  });
  if (!r || !r.id) return;
  const id = r.id.trim().toUpperCase();
  if (selectedCountries.length === 0) { toast('Au moins 1 marché requis', 'error'); return; }

  let driveFolderId = (r.driveFolderId || '').trim() || null;
  const autoCreate = r.autoCreateDrive === 'on' || r.autoCreateDrive === true || document.querySelector('[data-field="autoCreateDrive"]')?.checked;

  // S'assurer que masterCountry est valide
  if (!masterCountry || !selectedCountries.includes(masterCountry)) {
    masterCountry = computeDefaultMaster(selectedCountries);
  }

  // 1. Créer le produit en DB
  const priority = (r.priority || 'normal');
  const concurrentPageUrl = (r.concurrentPageUrl || '').trim() ? normalizeUrl(r.concurrentPageUrl.trim()) : null;
  const { error: errP } = await sb.from('products').insert({
    id, name: (r.name || '').trim() || id,
    enabled_countries: selectedCountries,
    master_country_id: masterCountry,
    drive_folder_id: driveFolderId,
    priority,
    concurrent_page_url: concurrentPageUrl,
    created_by: currentUser.id
  });
  if (errP) { toast('Erreur : ' + errP.message, 'error'); return; }

  toast(`Produit ${id} créé`, 'success');

  // 2. Créer la structure Drive si demandé
  if (autoCreate && driveState.connected && !driveFolderId) {
    try {
      const { data: product } = await sb.from('products').select('*').eq('id', id).single();
      const countries = allCountries.filter(c => selectedCountries.includes(c.id));
      await createProductDriveStructure(product, countries);
      toast(`📁 Structure Drive créée pour ${id}`, 'success');
    } catch (e) {
      console.error('[CREATE DRIVE STRUCT]', e);
      const msg = extractGapiError(e);
      toast('⚠ Produit créé mais Drive a échoué : ' + msg, 'warn', 8000);
      // Log pour debug
      await logSync(`Erreur création structure Drive pour ${id} : ${msg}`, 'error');
    }
  }

  // 3. Upload des videos concurrent si présentes
  if (concurrentFiles.length > 0 && driveState.connected) {
    try {
      await uploadToProductFolder(id, concurrentFiles, CONCURRENT_FOLDER_NAME);
    } catch (e) {
      toast('⚠ Erreur upload videos : ' + (e.message || 'inconnue'), 'warn', 6000);
    }
  }

  navigate('produit/' + id);
}

// Modal avec onOpen callback pour attacher des listeners custom
function modalWithOpen(contentHtml, onOpen) {
  return new Promise(resolve => {
    const container = document.getElementById('modal-container');
    const bd = document.createElement('div');
    bd.className = 'modal-backdrop';
    bd.innerHTML = `<div class="modal">${contentHtml}</div>`;
    container.appendChild(bd);
    const close = (r) => { if (bd.parentNode) bd.remove(); resolve(r); };
    bd.addEventListener('click', (e) => { if (e.target === bd) close(null); });
    bd.querySelectorAll('[data-modal-close]').forEach(el => el.addEventListener('click', () => close(null)));
    bd.querySelectorAll('[data-modal-ok]').forEach(el => el.addEventListener('click', () => {
      const r = {};
      bd.querySelectorAll('[data-field]').forEach(f => { r[f.dataset.field] = f.value; });
      close(r);
    }));
    if (onOpen) onOpen(bd);
    setTimeout(() => bd.querySelector('input:not([type=checkbox]),select,textarea')?.focus(), 50);
  });
}

async function renderProduit(el, productId) {
  const [{ data: product }, { data: ads }, { data: countriesAll }, { data: adCountries }] = await Promise.all([
    sb.from('products').select('*').eq('id', productId).single(),
    sb.from('ads').select('*').eq('product_id', productId).order('position'),
    sb.from('countries').select('*').order('sort_order'),
    sb.from('ad_countries').select('*')
  ]);
  if (!product) { el.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Produit introuvable</div></div>'; return; }
  const countries = (product.enabled_countries && product.enabled_countries.length)
    ? countriesAll.filter(c => product.enabled_countries.includes(c.id))
    : countriesAll;
  const acByAd = {};
  (adCountries || []).forEach(ac => {
    if (!acByAd[ac.ad_id]) acByAd[ac.ad_id] = {};
    acByAd[ac.ad_id][ac.country_id] = ac;
  });

  const cutCount = (product.cut_countries || []).length;
  const activeCount = countries.length - cutCount;
  const totalActive = ads.length * activeCount;
  let totalTrad = 0, totalMeta = 0;
  const byCountry = {};
  countries.forEach(c => { byCountry[c.id] = { trad: 0, meta: 0 }; });
  ads.forEach(ad => countries.forEach(c => {
    const ac = (acByAd[ad.id] || {})[c.id] || {};
    const isCut = (product.cut_countries || []).includes(c.id);
    if (!isCut) {
      if (ac.trad) { totalTrad++; byCountry[c.id].trad++; }
      if (ac.meta) { totalMeta++; byCountry[c.id].meta++; }
    }

        <div class="kpi-label">Trad faites</div>
        <div class="kpi-value green">${fmt(totalTrad)}/${fmt(totalActive)}</div>
        <div class="kpi-sub">${pct(totalTrad, totalActive)}%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Meta lancées</div>
        <div class="kpi-value blue">${fmt(totalMeta)}/${fmt(totalActive)}</div>

      <div class="kpi-card">

        <div class="kpi-sub">${cutCount > 0 ? `<span style="color:var(--red)">✂ ${cutCount} coupé${cutCount > 1 ? 's' : ''}</span> · ` : ''}${pct(totalTrad + totalMeta, totalActive * 2)}% progression</div>

          <div style="font-size:24px;margin-bottom:8px">🎬</div>
          <div style="font-weight:600;margin-bottom:4px">Masters (nettoyés)</div>
          <div class="text-sm text-dim">Sans sous-titres → <span class="mono">${MASTER_FOLDER_NAME}/</span></div>
          <input type="file" multiple style="display:none" data-file-input="master" accept="video/*,image/*">
        </div>
      </div>
      ${!driveState.connected ? '<div class="text-sm text-dim" style="margin-top:12px;padding:10px;background:var(--bg-input);border-radius:6px;border-left:3px solid var(--blue)">💡 Connecte-toi à Google Drive (sidebar ☁️) pour activer l\'upload auto.</div>' : ''}
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">📁 Config Drive</div>
      </div>
      <div class="grid-2">
        <div>
          <div class="text-sm text-dim" style="margin-bottom:4px">Dossier Drive du produit</div>
          <div class="mono text-sm" style="padding:10px;background:var(--bg-input);border-radius:6px;word-break:break-all;border:1px solid var(--border-soft)">
            ${product.drive_folder_id ? escapeHtml(product.drive_folder_id) : '<span style="color:var(--text-mute)">Non configuré — clique ⚙️ Éditer pour ajouter l\'ID</span>'}
          </div>
        </div>
        <div>
          <div class="text-sm text-dim" style="margin-bottom:4px">Structure attendue dans ce dossier</div>
          <div class="mono text-sm" style="padding:10px;background:var(--bg-input);border-radius:6px;line-height:1.7;border:1px solid var(--border-soft)">
            📁 ${escapeHtml(product.id)}${product.name && product.name !== product.id ? ' — ' + escapeHtml(product.name) : ''}/<br>
            &nbsp;&nbsp;📁 <span style="color:var(--gold)">00_Ads_Concurrent/</span> <span class="text-mute">(videos brutes)</span><br>
            &nbsp;&nbsp;📁 <span style="color:var(--gold)">00_Master_Ads/</span> <span class="text-mute">(videos nettoyées)</span><br>
            ${countries.map(c => {
              const isCut = cutCountries.includes(c.id);
              return `&nbsp;&nbsp;📁 <span style="color:${isCut ? 'var(--red)' : 'var(--gold)'};${isCut ? 'text-decoration:line-through' : ''}">${escapeHtml(c.id)}/</span> <span class="text-mute">(Ad 1.mp4, Ad 2.mp4, ...)</span>`;

    if (!driveState.connected) { toast('Connecte-toi à Drive d\'abord', 'warn'); return; }
    const { data: countriesData } = await sb.from('countries').select('*');
    await syncProductFolderColors(product, countriesData || []);
  });

  // Dropzones upload (Drag & drop + clic)
  extraSections.querySelectorAll('.dropzone').forEach(dz => {
    const target = dz.dataset.uploadTarget;
    const targetFolderName = target === 'concurrent' ? CONCURRENT_FOLDER_NAME : MASTER_FOLDER_NAME;
    const fileInput = dz.querySelector('[data-file-input]');
    const handleFiles = async (files) => {
      if (!files || !files.length) return;
      if (!driveState.connected) { toast('Connecte-toi à Drive d\'abord', 'warn'); return; }
      if (!canEdit()) { toast('Permission refusée', 'error'); return; }
      try {
        await uploadToProductFolder(productId, files, targetFolderName);
        render();
      } catch (e) {
        console.error('[UPLOAD]', e);
        toast('Erreur upload : ' + (e.message || JSON.stringify(e)), 'error', 6000);
      }
    };
    // Clic → sélecteur fichier
    dz.addEventListener('click', (e) => {
      if (!driveState.connected || !canEdit()) return;
      if (e.target.tagName !== 'INPUT') fileInput?.click();
    });
    fileInput?.addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value = ''; });
    // Drag & drop
    dz.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (driveState.connected && canEdit()) {
        dz.style.borderColor = 'var(--gold)';
        dz.style.background = 'rgba(200,165,90,0.1)';
      }
    });
    dz.addEventListener('dragleave', () => {
      dz.style.borderColor = '';
      dz.style.background = '';
    });
    dz.addEventListener('drop', (e) => {
      e.preventDefault();
      dz.style.borderColor = '';
      dz.style.background = '';
      handleFiles(e.dataTransfer.files);
    });
  });

  // Event listeners pour cut/activate markets
  extraSections.querySelectorAll('[data-toggle-cut]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!canEdit()) { toast('Permission refusée', 'error'); return; }

      const wasCut = currentCut.includes(cId);
      const newCut = wasCut ? currentCut.filter(x => x !== cId) : [...currentCut, cId];
      const isCutNow = !wasCut;

      const { error } = await sb.from('products').update({ cut_countries: newCut }).eq('id', productId);
      if (error) { toast('Erreur : ' + error.message, 'error'); return; }
      toast(isCutNow ? `${cId} coupé` : `${cId} réactivé`, isCutNow ? 'info' : 'success');

      if (driveState.connected && product.drive_folder_id) {
        const ok = await syncOneCountryFolderColor({ ...product, drive_folder_id: product.drive_folder_id }, cId, isCutNow);
        if (ok) {
          toast(`🎨 Couleur Drive ${cId} mise à jour`, 'success', 3000);
        }
      }

      render();
    });
  });

  // Ad Copy icons
  el.querySelectorAll('[data-ad-copy]').forEach(icon => {
    icon.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!canEdit()) { toast('Permission refusée', 'error'); return; }
      editAdCopyFlow(icon.dataset.adCopy);
    });
  });

  // Drag Excel-style + simple click sur Meta cells
  setupMetaDragSelect(el);

  document.getElementById('btn-add-ad')?.addEventListener('click', () => addAdFlow(productId));
  document.getElementById('btn-edit-product')?.addEventListener('click', () => editProductFlow(productId));
}

async function editProductFlow(productId) {
  const { data: product } = await sb.from('products').select('*').eq('id', productId).single();
  const { data: allCountries } = await sb.from('countries').select('*').order('sort_order');
  if (!product) return;
  const enabled = (product.enabled_countries && product.enabled_countries.length) ? [...product.enabled_countries] : allCountries.map(c => c.id);
  let masterCountry = product.master_country_id || computeDefaultMaster(enabled);
  const countriesHtml = allCountries.map(c => `
    <label style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;user-select:none;font-size:12px;background:${c.color}22;color:${c.color};border:1px solid ${c.color}44">
      <input type="checkbox" data-edit-country-check="${c.id}" ${enabled.includes(c.id) ? 'checked' : ''} style="margin:0;accent-color:${c.color}">
      ${c.id}
    </label>
  `).join('');
  const masterSelectHtml = allCountries.map(c => `<option value="${c.id}" ${c.id === masterCountry ? 'selected' : ''}>${c.id} — ${escapeHtml(c.name)}</option>`).join('');

  let deleteRequested = false;
  const r = await modalWithOpen(`
    <div class="modal-title">Éditer ${escapeHtml(product.id)}</div>
    <div class="input-group">
      <label class="input-label">Nom / description</label>
      <input class="input" data-field="name" value="${escapeHtml(product.name || '')}">
    </div>
    <div class="input-group">
      <label class="input-label">ID du dossier Drive</label>
      <input class="input mono" data-field="driveFolderId" value="${escapeHtml(product.drive_folder_id || '')}" placeholder="1ABCxyz...">
      <div class="input-hint">Récupère l'ID depuis l'URL Drive: drive.google.com/drive/folders/<strong>ID_ICI</strong></div>
    </div>
    <div class="input-group">
      <label class="input-label">🌍 Marchés actifs pour ce produit</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--bg-input);border-radius:8px;border:1px solid var(--border)">
        ${countriesHtml}
      </div>
      <div class="input-hint">Décoche les pays où tu ne lances pas ce produit.</div>
    </div>
    <div class="input-group">
      <label class="input-label">🏁 Pays Master (optionnel — référence interne)</label>
      <select class="select" id="edit-master-country">
        ${masterSelectHtml}
      </select>
      <div class="input-hint">Indique juste quel pays sert de référence. Si tu coupes ce pays, il bascule automatiquement.</div>
    </div>
    <div class="input-group">
      <label class="input-label">⚡ Priorité</label>
      <select class="select" data-field="priority">
        <option value="urgent" ${product.priority === 'urgent' ? 'selected' : ''}>🔴 URGENT</option>
        <option value="high" ${product.priority === 'high' ? 'selected' : ''}>🟠 HAUTE</option>
        <option value="normal" ${(!product.priority || product.priority === 'normal') ? 'selected' : ''}>🔵 NORMALE</option>
        <option value="low" ${product.priority === 'low' ? 'selected' : ''}>⚪ BASSE</option>
      </select>
    </div>
    <div class="input-group">
      <label class="input-label">🔗 URL Concurrent (référence pour page builder)</label>
      <input class="input" data-field="concurrentPageUrl" value="${escapeHtml(product.concurrent_page_url || '')}" placeholder="https://concurrent.com/products/...">
    </div>
    <div class="modal-actions">
      ${isAdmin() ? '<button class="btn btn-danger btn-sm" id="btn-delete-product">Supprimer produit</button>' : ''}
      <div style="flex:1"></div>
      <button class="btn btn-secondary" data-modal-close>Annuler</button>
      <button class="btn" data-modal-ok>Enregistrer</button>
    </div>
  `, (bd) => {
    const masterSel = bd.querySelector('#edit-master-country');
    bd.querySelectorAll('[data-edit-country-check]').forEach(cb => {
      cb.addEventListener('change', () => {
        const cid = cb.dataset.editCountryCheck;
        if (cb.checked) { if (!enabled.includes(cid)) enabled.push(cid); }
        else { const i = enabled.indexOf(cid); if (i >= 0) enabled.splice(i, 1); }
        // Auto-change master si coupé
        if (!enabled.includes(masterCountry)) {
          masterCountry = computeDefaultMaster(enabled);
          if (masterSel) masterSel.value = masterCountry || '';
          if (masterCountry) toast(`Master changé automatiquement vers ${masterCountry}`, 'info');
        }
      });
    });
    if (masterSel) masterSel.addEventListener('change', () => { masterCountry = masterSel.value; });
    bd.querySelector('#btn-delete-product')?.addEventListener('click', async () => {
      bd.remove();
      deleteRequested = true;
      await deleteProductWithDriveOption(product.id);
      navigate('produits');
    });
  });
  if (deleteRequested) return;
  if (!r) return;
  if (enabled.length === 0) { toast('Au moins 1 marché requis', 'error'); return; }
  if (!masterCountry || !enabled.includes(masterCountry)) masterCountry = computeDefaultMaster(enabled);

  const priority = (r.priority || 'normal');
  const concurrentPageUrl = (r.concurrentPageUrl || '').trim() ? normalizeUrl(r.concurrentPageUrl.trim()) : null;
  const { error } = await sb.from('products').update({
    name: (r.name || '').trim() || product.id,
    drive_folder_id: (r.driveFolderId || '').trim() || null,
    enabled_countries: enabled,
    master_country_id: masterCountry,
    priority,
    concurrent_page_url: concurrentPageUrl
  }).eq('id', product.id);
  if (error) { toast('Erreur : ' + error.message, 'error'); return; }
  toast('Produit mis à jour', 'success');
  render();
}

async function addAdFlow(productId) {
  const { data: existing } = await sb.from('ads').select('name').eq('product_id', productId);
  const maxN = (existing || []).reduce((m, a) => { const n = parseInt((a.name.match(/\d+/) || [0])[0], 10); return Math.max(m, n); }, 0);
  const r = await modal(`
    <div class="modal-title">Ajouter des ads</div>
    <div class="input-group">
      <label class="input-label">De</label>
      <input class="input" type="number" data-field="from" value="${maxN + 1}" min="1">
    </div>
    <div class="input-group">
      <label class="input-label">À (inclus)</label>
      <input class="input" type="number" data-field="to" value="${maxN + 1}" min="1">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" data-modal-close>Annuler</button>
      <button class="btn" data-modal-ok>Ajouter</button>
    </div>
  `);
  if (!r) return;
  const from = parseInt(r.from), to = parseInt(r.to);
  if (!from || !to || from > to) { toast('Intervalle invalide', 'error'); return; }
  const { data: product } = await sb.from('products').select('enabled_countries').eq('id', productId).single();
  const { data: countriesAll } = await sb.from('countries').select('id');
  const enabled = (product.enabled_countries && product.enabled_countries.length) ? product.enabled_countries : countriesAll.map(c => c.id);
  const adsToInsert = [];
  for (let i = from; i <= to; i++) adsToInsert.push({ product_id: productId, name: 'Ad ' + i, position: i });
  const { data: inserted, error } = await sb.from('ads').insert(adsToInsert).select();
  if (error) { toast('Erreur : ' + error.message, 'error'); return; }
  const acToInsert = [];
  inserted.forEach(ad => enabled.forEach(cId => acToInsert.push({ ad_id: ad.id, country_id: cId, trad: false, meta: false })));
  await sb.from('ad_countries').insert(acToInsert);
  toast(`${inserted.length} ad(s) ajoutée(s)`, 'success');
  render();
}

async function inviteUserFlow() {
  const r = await modal(`
    <div class="modal-title">Inviter un nouvel utilisateur</div>
    <div class="text-sm text-dim mb-md">Il recevra un email d'invitation pour créer son mot de passe et accéder à l'app.</div>
    <div class="input-group">
      <label class="input-label">Email</label>
      <input type="email" class="input" data-field="email" placeholder="employe@example.com" autofocus>
    </div>
    <div class="input-group">
      <label class="input-label">Nom complet (optionnel)</label>
      <input class="input" data-field="full_name" placeholder="Prénom Nom">
    </div>
    <div class="input-group">
      <label class="input-label">Rôle</label>
      <select class="select" data-field="role">
        <option value="editor">Editor (créer/modifier produits et ads)</option>
        <option value="page_builder">Page Builder (uniquement pages landing)</option>
        <option value="viewer">Viewer (lecture seule)</option>
        <option value="admin">Admin (tout)</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" data-modal-close>Annuler</button>
      <button class="btn" data-modal-ok>📧 Envoyer l'invitation</button>
    </div>
  `);
  if (!r || !r.email) return;
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { toast('Session expirée', 'error'); return; }
    const res = await fetch('/api/invite-user', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.access_token}`
      },
      body: JSON.stringify({
        email: r.email.trim().toLowerCase(),
        role: r.role,
        full_name: (r.full_name || '').trim()
      })
    });
    const data = await res.json();
    if (!res.ok) {
      toast('Erreur : ' + (data.error || 'invitation échouée'), 'error', 6000);
      return;
    }
    toast(`✅ Invitation envoyée à ${r.email}`, 'success', 5000);
    render();
  } catch (e) {
    console.error(e);
    toast('Erreur réseau : ' + e.message, 'error');
  }
}

async function connectShopifyFlow(countryId) {
  const { data: country } = await sb.from('countries').select('*').eq('id', countryId).single();
  if (!country) return;

  // Check si les creds d'app Dev Dashboard sont déjà enregistrées pour ce pays
  const { data: existingApp } = await sb.from('shopify_apps').select('client_id').eq('country_id', countryId).maybeSingle();
  const hasApp = !!existingApp;

  const credsSection = hasApp ? `
    <div style="background:var(--bg-input);border-left:3px solid var(--green);padding:10px 12px;border-radius:6px;margin-bottom:16px;font-size:12px">
      ✅ App Dev Dashboard déjà configurée pour ${countryId}. Tu peux lancer directement l'OAuth.
    </div>
  ` : `
    <div style="background:var(--bg-input);border-left:3px solid var(--orange);padding:12px;border-radius:6px;margin-bottom:16px;font-size:12px;line-height:1.7">
      <strong>⚠️ Première connexion pour ${countryId}</strong><br>
      Tu dois d'abord créer une app dans le <strong>Dev Dashboard Shopify</strong> de ce shop, puis coller ses identifiants ici.<br><br>
      <strong>Étapes</strong> :<br>
      1. Va dans l'admin du shop → <strong>Paramètres</strong> → <strong>Applications</strong> → <strong>Développer des applications dans le Dev Dashboard</strong><br>
      2. Crée une app → nom : <span class="mono">KeyCrop Manager ${countryId}</span><br>
      3. Configure scopes : <span class="mono">read_themes, write_themes, read_files, write_files, read_content, write_content</span><br>
      4. Configure redirect URL : <span class="mono">https://keycorp-ecom.com/api/shopify-callback</span><br>
      5. Distribution personnalisée → ciblée sur ton shop ${countryId}<br>
      6. Récupère <strong>ID client</strong> + <strong>Secret</strong> (onglet Paramètres de l'app)
    </div>
    <div class="input-group">
      <label class="input-label">Client ID (ID client de l'app)</label>
      <input type="text" class="input mono" data-field="client_id" placeholder="0a13bd9e775a0afcfd02edae5d512893">
    </div>
    <div class="input-group">
      <label class="input-label">Client Secret</label>
      <input type="password" class="input mono" data-field="client_secret" placeholder="shpss_...">
      <div class="input-hint">Stocké en DB (admin only, RLS activé)</div>
    </div>
  `;

  const r = await modal(`
    <div class="modal-title">🔗 Connecter shop Shopify ${flagImg(countryId)}${countryId}</div>
    ${credsSection}
    <div style="background:var(--bg-input);border-left:3px solid var(--blue);padding:10px 12px;border-radius:6px;margin-bottom:16px;font-size:12px">
      <strong>💡 Shop domain</strong> = subdomain <span class="mono">.myshopify.com</span> (pas le domaine custom comme salvyne.de).<br>
      Trouvé dans admin → Paramètres → Domaines.
    </div>
    <div class="input-group">
      <label class="input-label">Shop domain (myshopify.com)</label>
      <input type="text" class="input mono" data-field="shop" placeholder="salvyne-${countryId.toLowerCase()}.myshopify.com" autofocus>
      <div class="input-hint">Ex: <span class="mono">salvyne-de.myshopify.com</span></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" data-modal-close>Annuler</button>
      <button class="btn" data-modal-ok>🔗 Lancer l'OAuth</button>
    </div>
  `);
  if (!r || !r.shop) return;

  let shop = r.shop.trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
  if (!/^[a-z0-9][a-z0-9-]*\.myshopify\.com$/.test(shop)) {
    if (/^[a-z0-9][a-z0-9-]*$/.test(shop)) shop = shop + '.myshopify.com';
    else {
      toast('Format invalide. Tu dois entrer le subdomain .myshopify.com (trouvé dans Paramètres → Domaines de ton shop)', 'error', 8000);
      return;
    }
  }

  // Si pas de creds en DB → on doit d'abord les enregistrer
  if (!hasApp) {
    const clientId = (r.client_id || '').trim();
    const clientSecret = (r.client_secret || '').trim();
    if (!clientId || !clientSecret) {
      toast('Client ID et Client Secret requis pour la première connexion', 'error');
      return;
    }
    if (!/^[a-f0-9]{32}$/i.test(clientId)) {
      toast('Client ID invalide (32 caractères hex attendus)', 'error');
      return;
    }
    if (!clientSecret.startsWith('shpss_')) {
      toast('Client Secret invalide (doit commencer par shpss_)', 'error');
      return;
    }
    // Save creds
    const { error } = await sb.from('shopify_apps').upsert({
      country_id: countryId,
      client_id: clientId,
      client_secret: clientSecret,
      created_by: currentUser.id
    }, { onConflict: 'country_id' });
    if (error) { toast('Erreur save creds : ' + error.message, 'error', 8000); return; }
    toast('Creds enregistrées, lancement OAuth...', 'info');
  }

  // Redirige vers /api/shopify-install qui lit client_id depuis DB
  const installUrl = `/api/shopify-install?shop=${encodeURIComponent(shop)}&country=${encodeURIComponent(countryId)}`;
  window.location.href = installUrl;
}

async function disconnectShopify(countryId) {
  if (!(await confirmDialog('Déconnecter le shop', `Le token pour ${countryId} sera supprimé. Tu devras te reconnecter pour utiliser la duplication auto sur ce pays.`))) return;
  const { error } = await sb.from('shopify_connections').delete().eq('country_id', countryId);
  if (error) { toast('Erreur : ' + error.message, 'error'); return; }
  toast(`Shop ${countryId} déconnecté`, 'success');
  render();
}

// Check URL hash for shopify_connected flag (redirect from callback)
function checkShopifyCallbackFlag() {
  const hash = window.location.hash;
  if (hash.includes('shopify_connected=')) {
    const match = hash.match(/shopify_connected=([A-Z]{2,3})/);
    if (match) {
      toast(`✅ Shop ${match[1]} connecté avec succès !`, 'success', 5000);
      // Clean up URL
      const cleanHash = hash.replace(/[?&]shopify_connected=[A-Z]{2,3}/, '');
      window.location.hash = cleanHash;
    }
  }
}

async function deleteProductWithDriveOption(productId) {
  const { data: product } = await sb.from('products').select('*').eq('id', productId).single();
  if (!product) return;
  const hasDriveFolder = !!product.drive_folder_id;

  const r = await modal(`
    <div class="modal-title" style="color:var(--red)">Supprimer ${escapeHtml(product.id)}</div>
    <div class="text-sm text-dim mb-md">Le produit <strong>${escapeHtml(product.id)}</strong> et toutes ses ads seront supprimés. <strong>Irréversible.</strong></div>
    ${hasDriveFolder ? `
      <div style="padding:12px;background:var(--bg-input);border-radius:8px;border:1px solid var(--border-soft);margin-bottom:14px">
        <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;user-select:none">
          <input type="checkbox" data-field="deleteDrive" style="margin:4px 0 0 0;accent-color:var(--red);flex-shrink:0" ${driveState.connected ? '' : 'disabled'}>
          <div>
            <div style="font-weight:600;color:var(--red)">🗑 Supprimer aussi le dossier Drive</div>
            <div class="text-sm text-dim" style="margin-top:2px">Le dossier sera mis à la corbeille Drive (récupérable 30 jours)</div>
            ${!driveState.connected ? '<div class="text-sm" style="color:var(--orange);margin-top:4px">⚠ Connecte-toi à Drive d\'abord</div>' : ''}
          </div>
        </label>
      </div>
    ` : ''}
    <div class="modal-actions">
      <button class="btn btn-secondary" data-modal-close>Annuler</button>
      <button class="btn btn-danger" data-modal-ok>Supprimer</button>
    </div>
  `);
  if (!r) return;

  const deleteDrive = r.deleteDrive === 'on' || r.deleteDrive === true;

  // 1. Supprimer de la DB
  const { error } = await sb.from('products').delete().eq('id', productId);
  if (error) { toast('Erreur suppression : ' + error.message, 'error'); return; }
  toast(`${productId} supprimé`, 'success');

  // 2. Supprimer le dossier Drive si demandé
  if (deleteDrive && hasDriveFolder && driveState.connected) {
    try {
      await driveTrashFolder(product.drive_folder_id);
      toast('🗑 Dossier Drive mis à la corbeille', 'success');
      await logSync(`🗑 Dossier Drive de ${productId} mis à la corbeille`, 'info');
    } catch (e) {
      console.error('[DELETE DRIVE]', e);
      toast('⚠ DB supprimée mais erreur Drive : ' + extractGapiError(e), 'warn', 6000);
    }
  }

  render();
}

async function exportAllData() {
  const { data: countries } = await sb.from('countries').select('*');
  const { data: products } = await sb.from('products').select('*');
  const { data: ads } = await sb.from('ads').select('*');
  const { data: adCountries } = await sb.from('ad_countries').select('*');
  const { data: profiles } = await sb.from('profiles').select('*');
  const exportData = { exported_at: new Date().toISOString(), countries, products, ads, adCountries, profiles };
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `keycorp-ecom-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Export téléchargé', 'success');
}

  };

    type: 'bar',
    data: { labels: countries.map(c => c.id), datasets: [{ data: countries.map(c => byCountry[c.id].meta), backgroundColor: countries.map(c => c.color), borderRadius: 6 }] },

  }));
  const tradCtx = document.getElementById('chart-trad');
  if (tradCtx) chartInstances.push(new Chart(tradCtx, {
    type: 'bar',

    options: Object.assign({}, baseOpts, { plugins: { legend: { display: false } } })
  }));
  const prodCtx = document.getElementById('chart-prod');
  if (prodCtx && products.length > 0) chartInstances.push(new Chart(prodCtx, {
    type: 'bar',
    data: {
      labels: products.map(p => p.id),
      datasets: [
        { label: 'Traductions', data: products.map(p => { let c = 0; const pAds = ads.filter(a => a.product_id === p.id); pAds.forEach(ad => countries.forEach(co => { const ac = adCountries.find(x => x.ad_id === ad.id && x.country_id === co.id); if (ac?.trad) c++; })); return c; }), backgroundColor: '#34d39988', borderColor: '#34d399', borderWidth: 1 },
        { label: 'Meta lancées', data: products.map(p => { let c = 0; const pAds = ads.filter(a => a.product_id === p.id); pAds.forEach(ad => countries.forEach(co => { const ac = adCountries.find(x => x.ad_id === ad.id && x.country_id === co.id); if (ac?.meta) c++; })); return c; }), backgroundColor: '#60a5fa88', borderColor: '#60a5fa', borderWidth: 1 }
      ]
    },
    options: Object.assign({}, baseOpts, { indexAxis: 'y' })
  }));
  const repCtx = document.getElementById('chart-repart');
  if (repCtx) chartInstances.push(new Chart(repCtx, {
    type: 'doughnut',
    data: { labels: countries.map(c => c.id + ' (Meta)'), datasets: [{ data: countries.map(c => byCountry[c.id].meta), backgroundColor: countries.map(c => c.color), borderColor: '#12121a', borderWidth: 2 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#8a8a9a', font: { family: 'Outfit', size: 12 } } } } }
  }));
}
